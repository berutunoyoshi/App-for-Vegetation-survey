<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24543E">
<meta name="description" content="Braun-Blanquet法による植生調査の記録から、植生表・群落区分・遷移予測・植生図作成までをオフラインで行う野帳アプリ">
<title>植生野帳 — 植物社会学的植生調査</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>  <rect width='512' height='512' rx='96' fill='%2324543E'/>  <rect x='96' y='96' width='320' height='320' rx='20' fill='none' stroke='%23FFFFFF' stroke-width='28'/>  <g stroke-linecap='round' stroke-width='34'>    <line x1='168' y1='352' x2='168' y2='232' stroke='%23C2A73A'/>    <line x1='232' y1='352' x2='232' y2='168' stroke='%23FFFFFF'/>    <line x1='296' y1='352' x2='296' y2='256' stroke='%239CC46A'/>    <line x1='352' y1='352' x2='352' y2='296' stroke='%23D92E63'/>  </g></svg>">

<style>
/* 植生野帳 — 野外の明るさでも読める高コントラスト、層の色を情報として使う */
:root {
  color-scheme: light;
  --bg: #EEF2EC;
  --surface: #FFFFFF;
  --surface-2: #F6F8F4;
  --ink: #18231C;
  --muted: #56645B;
  --line: #C9D3CA;
  --forest: #24543E;
  --forest-ink: #FFFFFF;
  --tape: #D92E63;          /* 調査用マーキングテープの桃色 */
  --tape-soft: #FBE3EB;
  --warn: #9A5B00;
  --warn-soft: #FFF1D6;
  --L-T1: #1F4D36; --L-T2: #3F7B50; --L-S: #7DA34C; --L-H: #C2A73A; --L-M: #8A6B48;
  --g0: #2E6F9E; --g1: #C0582B; --g2: #4E8A3A; --g3: #8A4FA0; --g4: #B08A1E; --g5: #2C8C8C; --g6: #A33A4E; --g7: #5A5F6B;
  --radius: 10px;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --tabbar-h: 62px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="field"]) {
    color-scheme: dark;
    --bg: #111814; --surface: #19221D; --surface-2: #202B25; --ink: #E4ECE6; --muted: #9AA99F; --line: #33423A;
    --forest: #6FB08C; --forest-ink: #0D1611; --tape: #FF6E97; --tape-soft: #3A1B26; --warn: #F2B65A; --warn-soft: #33270F;
    --L-T1: #5FA37E; --L-T2: #7DB98A; --L-S: #A9CB6F; --L-H: #E0C760; --L-M: #C09A6E;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111814; --surface: #19221D; --surface-2: #202B25; --ink: #E4ECE6; --muted: #9AA99F; --line: #33423A;
  --forest: #6FB08C; --forest-ink: #0D1611; --tape: #FF6E97; --tape-soft: #3A1B26; --warn: #F2B65A; --warn-soft: #33270F;
  --L-T1: #5FA37E; --L-T2: #7DB98A; --L-S: #A9CB6F; --L-H: #E0C760; --L-M: #C09A6E;
}
/* 屋外モード：直射日光下用。白地に純黒、太字、大きめの文字 */
:root[data-theme="field"] {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2F2F2; --ink: #000000; --muted: #2B2B2B; --line: #000000;
  --forest: #0B3D24; --tape: #C0003F;
  font-size: 18px;
}
:root[data-theme="field"] body { font-weight: 600; }

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 1rem; line-height: 1.6;
  font-variant-numeric: tabular-nums;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--forest); z-index: 30; }
a { color: var(--forest); }
:focus-visible { outline: 3px solid var(--tape); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- 上部バー ---- */
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; padding: 0 16px; background: var(--forest); color: var(--forest-ink);
}
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 700; font-size: 1.1rem; letter-spacing: .04em; }
.net { font-size: .8rem; padding: 2px 10px; border-radius: 99px; background: rgba(255,255,255,.18); }
.net.off { background: var(--tape); color: #fff; }

/* ---- 下部タブ ---- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface); border-top: 1px solid var(--line);
}
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: .72rem; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] { color: var(--forest); font-weight: 700; }
.tabbar a[aria-current="page"] svg { stroke-width: 2.4; }

/* ---- レイアウト ---- */
main { max-width: 1100px; margin: 0 auto; padding: 16px 14px 32px; outline: none; }
h1 { font-size: 1.45rem; line-height: 1.3; margin: 4px 0 4px; letter-spacing: .02em; }
h2 { font-size: 1.12rem; margin: 0 0 10px; }
h3 { font-size: 1rem; margin: 14px 0 6px; }
p { margin: 0 0 10px; max-width: 72ch; }
.lead { color: var(--muted); margin-bottom: 16px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.stack > * + * { margin-top: 12px; }

section.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 14px;
}
section.panel > h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
details.panel > summary { cursor: pointer; font-weight: 700; list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "＋"; float: right; color: var(--muted); }
details.panel[open] > summary::after { content: "－"; }

/* ---- フォーム ---- */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
label.f > span { font-weight: 600; }
input, select, textarea, button { font: inherit; color: inherit; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 10px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
}
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--forest); outline: 2px solid color-mix(in srgb, var(--forest) 35%, transparent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600;
  text-decoration: none;
}
.btn:hover { border-color: var(--forest); }
.btn.primary { background: var(--forest); color: var(--forest-ink); border-color: var(--forest); }
.btn.tape { background: var(--tape); color: #fff; border-color: var(--tape); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--tape); border-color: color-mix(in srgb, var(--tape) 45%, var(--line)); }
.btn.sm { min-height: 36px; padding: 4px 10px; font-size: .88rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* セグメント（階層・被度・群度） */
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  min-width: 46px; min-height: 46px; padding: 4px 10px; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 1.05rem;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg.layers button { font-size: .9rem; min-width: 64px; border-left-width: 6px; }
.seg.layers button[data-l="T1"] { border-left-color: var(--L-T1); }
.seg.layers button[data-l="T2"] { border-left-color: var(--L-T2); }
.seg.layers button[data-l="S"] { border-left-color: var(--L-S); }
.seg.layers button[data-l="H"] { border-left-color: var(--L-H); }
.seg.layers button[data-l="M"] { border-left-color: var(--L-M); }

/* ---- 調査区カード ---- */
.rlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.rcard {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
}
.rcard .code { font-weight: 800; font-size: 1.05rem; }
.rcard .meta { color: var(--muted); font-size: .85rem; }
.rcard .comm { margin-top: 4px; font-size: .9rem; }
.rcard .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.rcard.excluded { opacity: .55; }

/* 階層の柱（層の被度を縦に示す、このアプリの目印） */
.strata { display: flex; flex-direction: column; gap: 2px; width: 30px; }
.strata i { display: block; height: 14px; background: var(--surface-2); border-radius: 2px; position: relative; overflow: hidden; }
.strata i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); background: var(--c); }
.strata i[data-l="T1"] { --c: var(--L-T1); } .strata i[data-l="T2"] { --c: var(--L-T2); }
.strata i[data-l="S"] { --c: var(--L-S); } .strata i[data-l="H"] { --c: var(--L-H); } .strata i[data-l="M"] { --c: var(--L-M); }

/* ---- 出現種リスト ---- */
.splayer { border-left: 6px solid var(--c, var(--line)); padding-left: 10px; margin: 12px 0; }
.splayer[data-l="T1"] { --c: var(--L-T1); } .splayer[data-l="T2"] { --c: var(--L-T2); }
.splayer[data-l="S"] { --c: var(--L-S); } .splayer[data-l="H"] { --c: var(--L-H); } .splayer[data-l="M"] { --c: var(--L-M); }
.splayer h3 { margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.sprow { display: grid; grid-template-columns: 1fr 70px 64px 40px; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.sprow select { min-height: 38px; padding: 4px 6px; }
.sprow .x { border: none; background: none; color: var(--tape); font-size: 1.3rem; cursor: pointer; min-height: 38px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; min-height: 34px;
  border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); font-size: .88rem; cursor: pointer;
}
.chip.char { border-color: var(--forest); color: var(--forest); font-weight: 700; }
.chip.hit { background: var(--forest); color: var(--forest-ink); border-color: var(--forest); }
.chip.miss { opacity: .55; text-decoration: line-through; }

.entry { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 6px); z-index: 5; box-shadow: 0 4px 18px rgba(0,0,0,.12); border-color: var(--forest); }
.entry { padding: 10px; }
.entry .sprow-input { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.entry .seg { flex-wrap: nowrap; gap: 4px; }
.entry .seg button { flex: 1 1 0; min-width: 0; min-height: 42px; padding: 2px 4px; }
.entry .seg.layers button { font-size: .85rem; border-left-width: 5px; }
.entry-scales { display: grid; grid-template-columns: 2.6em 1fr; gap: 6px 6px; align-items: center; }
.entry-scales .lbl { font-size: .8rem; color: var(--muted); font-weight: 700; }
.chips.recent { flex-wrap: nowrap; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; }
.chips.recent:empty { display: none; }
.chips.recent .chip { flex: none; }

/* ---- 植生表 ---- */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-height: 70vh; }
table.veg { border-collapse: separate; border-spacing: 0; font-size: .82rem; white-space: nowrap; }
table.veg th, table.veg td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: center; }
table.veg thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 2; }
table.veg thead tr:nth-child(2) th { top: 26px; }
table.veg thead tr:nth-child(3) th { top: 52px; }
table.veg .sp { position: sticky; left: 0; background: var(--surface); text-align: left; z-index: 1; min-width: 150px; font-weight: 600; }
table.veg thead .sp { z-index: 3; background: var(--surface-2); }
table.veg .ly { color: var(--muted); font-weight: 400; font-size: .75rem; margin-left: 4px; }
table.veg tr.block th { text-align: left; background: var(--surface-2); color: var(--muted); font-weight: 700; position: sticky; left: 0; }
table.veg td.on { font-weight: 700; }
table.veg td.blk { background: color-mix(in srgb, var(--gc) 22%, transparent); }
table.veg td.gstart, table.veg th.gstart { border-left: 2px solid var(--ink); }
table.veg .gl { color: #fff; background: var(--gc); border-radius: 4px; padding: 0 6px; font-weight: 800; }

/* ---- 判定 ---- */
.cand { padding: 10px 0; border-bottom: 1px solid var(--line); }
.cand:last-child { border-bottom: none; }
.bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; margin: 6px 0; }
.bar > i { display: block; height: 100%; background: var(--forest); }
.cand.top .bar > i { background: var(--tape); }
.flag { display: inline-block; font-size: .75rem; padding: 0 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); margin-left: 6px; }
.note { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: .9rem; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: .78rem; }

.timeline { width: 100%; overflow-x: auto; }
.timeline svg { display: block; width: 100%; max-width: 640px; height: auto; }
.timeline text { fill: var(--ink); font-family: var(--font); }
.yearout { font-size: 1.15rem; font-weight: 800; }
input[type=range] { width: 100%; accent-color: var(--tape); min-height: 40px; }

/* ---- 地図 ---- */
#map { position: relative; z-index: 0; isolation: isolate; height: 62vh; min-height: 360px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: .85rem; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.leaflet-container { font-family: var(--font); }

/* ---- 汎用 ---- */
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty .btn { margin: 6px; }
.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 60px);
  transform: translateX(-50%) translateY(-12px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 8px; z-index: 50;
  transition: opacity .2s, transform .2s; max-width: 90vw; font-size: .92rem;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
table.plain { border-collapse: collapse; font-size: .85rem; width: 100%; }
table.plain th, table.plain td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }
table.plain input { min-height: 34px; padding: 2px 6px; }

@media (min-width: 900px) {
  .twocol { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; align-items: start; }
}
@media print {
  .appbar, .tabbar, .btn, .entry, .noprint { display: none !important; }
  body { padding: 0; background: #fff; }
  .tablewrap { max-height: none; overflow: visible; border: none; }
}

</style>

    <span>植生野帳</span>

<nav class="tabbar" aria-label="主要画面">

<script>

/* ===== data.js ===== */
/* =========================================================
   参照データ（植生帯・群集・種名・被度階級）
   ※群集データは代表的な構成種による「簡易参照DB」です。
     正式な標徴種・識別種は原記載・地域植生誌で必ず確認してください。
     設定画面から独自のJSONを読み込んで拡張・置換できます。
   ========================================================= */
'use strict';

window.VEG = window.VEG || {};

/* ---------- 被度・群度 ---------- */
VEG.COVER_SCALES = {
  bb7: {
    name: 'Braun-Blanquet 7段階（r, +, 1〜5）',
    classes: [
      { v: 'r', label: 'r', desc: 'ごく稀・1〜数個体', mid: 0.1 },
      { v: '+', label: '+', desc: '少数・被度僅少', mid: 0.5 },
      { v: '1', label: '1', desc: '多数だが被度1/10以下', mid: 5 },
      { v: '2', label: '2', desc: '被度1/10〜1/4', mid: 17.5 },
      { v: '3', label: '3', desc: '被度1/4〜1/2', mid: 37.5 },
      { v: '4', label: '4', desc: '被度1/2〜3/4', mid: 62.5 },
      { v: '5', label: '5', desc: '被度3/4以上', mid: 87.5 }
    ]
  },
  bb5: {
    name: 'Braun-Blanquet 5段階（+, 1〜5）',
    classes: [

/* 都道府県と標高から植生帯を推定 */
VEG.zoneOf = function (prefName, elev, overrides) {
  const p0 = VEG.PREFS.find(p => p.name === prefName);
  if (!p0) return null;
  const p = Object.assign({}, p0, (overrides || {})[prefName] || {});
  const e = Number(elev) || 0;
  if (p.base === 'ST') return 'ST';
  if (p.base === 'MX') {
    if (e < p.cd) return 'MX';
    if (e < p.sa) return 'SA';
    return 'AL';
  }
  if (e < p.ev) return 'WE';
  if (e < p.cd) return 'CD';
  if (e < p.sa) return 'SA';
  return 'AL';
};

/* =========================================================
   解析エンジン
   - 植生表マトリックス作成
   - 類似度（Bray-Curtis / Jaccard）とUPGMAクラスタリング
   - 識別種の抽出（出現頻度＋φ係数）と表操作（並べ替え）
   - 常在度表（総合常在度表）
   - 群集参照DBとの照合（地域・植生帯を考慮）
   ========================================================= */
'use strict';

window.VEG = window.VEG || {};
VEG.Analysis = (function () {
  const LAYER_ORDER = { T1: 0, T2: 1, S: 2, H: 3, M: 4 };

  function keyOf(rec, merge) { return merge ? rec.sp : rec.sp + '|' + rec.layer; }
  function labelOf(key) {
    const [sp, layer] = key.split('|');
    return { sp, layer: layer || '' };
  }

  /* マトリックス：keys（行）× relevés（列）。値 = {cover, soc, mid} */
  function buildMatrix(releves, opts) {
    const merge = !!(opts && opts.mergeLayers);
    const rows = new Map();
    releves.forEach((r, j) => {
      (r.records || []).forEach(rec => {
        if (!rec.sp) return;
        const k = keyOf(rec, merge);
        if (!rows.has(k)) rows.set(k, new Array(releves.length).fill(null));
        const mid = VEG.coverMid(rec.cover);
        const cur = rows.get(k)[j];
        if (!cur) rows.get(k)[j] = { cover: rec.cover, soc: rec.soc, mid };
        else {
          // 層を統合する場合は独立重ね合わせで被度を合成し、表示は最大階級
          const comb = 100 * (1 - (1 - cur.mid / 100) * (1 - mid / 100));
          const better = mid > cur.mid ? { cover: rec.cover, soc: rec.soc } : { cover: cur.cover, soc: cur.soc };
          rows.get(k)[j] = Object.assign(better, { mid: comb });
        }
      });
    });
    const keys = Array.from(rows.keys());
    return { keys, rows, n: releves.length };
  }

  /* 類似度・距離 */
  function distance(mat, a, b, method) {
    let num = 0, den = 0, A = 0, B = 0, C = 0;
    mat.keys.forEach(k => {
      const row = mat.rows.get(k);
      const x = row[a] ? row[a].mid : 0, y = row[b] ? row[b].mid : 0;
      if (method === 'jaccard') {
        if (x > 0 && y > 0) A++; else if (x > 0) B++; else if (y > 0) C++;
      } else {
        const xs = Math.sqrt(x), ys = Math.sqrt(y);
        num += Math.abs(xs - ys); den += xs + ys;
      }
    });
    if (method === 'jaccard') return (A + B + C) === 0 ? 0 : 1 - A / (A + B + C);
    return den === 0 ? 0 : num / den;
  }

  /* UPGMA */
  function upgma(mat, method) {
    const n = mat.n;
    if (n === 0) return null;
    const D = [];
    for (let i = 0; i < n; i++) { D[i] = []; for (let j = 0; j < n; j++) D[i][j] = i === j ? 0 : (j < i ? D[j][i] : distance(mat, i, j, method)); }
    let clusters = [];
    for (let i = 0; i < n; i++) clusters.push({ id: i, leaves: [i], height: 0, left: null, right: null });
    const dist = (c1, c2) => {
      let s = 0; c1.leaves.forEach(a => c2.leaves.forEach(b => { s += D[a][b]; }));
      return s / (c1.leaves.length * c2.leaves.length);
    };
    while (clusters.length > 1) {
      let best = [0, 1], bd = Infinity;
      for (let i = 0; i < clusters.length; i++) for (let j = i + 1; j < clusters.length; j++) {
        const d = dist(clusters[i], clusters[j]);
        if (d < bd) { bd = d; best = [i, j]; }
      }
      const [i, j] = best;
      const merged = { id: null, leaves: clusters[i].leaves.concat(clusters[j].leaves), height: bd, left: clusters[i], right: clusters[j] };
      clusters = clusters.filter((_, k) => k !== i && k !== j);
      clusters.push(merged);
    }
    return clusters[0];
  }

  /* 樹形図をk群に切断 → relevé index → group (0..k-1)。並び順は樹形図の葉順 */
  function cutTree(root, k) {
    if (!root) return { groups: [], order: [] };
    let parts = [root];
    while (parts.length < k) {
      let idx = -1, h = -1;
      parts.forEach((p, i) => { if (p.left && p.height > h) { h = p.height; idx = i; } });
      if (idx < 0) break;
      const p = parts[idx];
      parts.splice(idx, 1, p.left, p.right);
    }
    const order = [];
    (function walk(nd) { if (!nd.left) order.push(nd.id); else { walk(nd.left); walk(nd.right); } })(root);
    const groups = [];
    parts.forEach((p, g) => p.leaves.forEach(l => { groups[l] = g; }));
    // 群番号を葉順に振り直す
    const remap = new Map(); let c = 0;
    order.forEach(l => { if (!remap.has(groups[l])) remap.set(groups[l], c++); });
    return { groups: groups.map(g => remap.get(g)), order };
  }

  /* φ係数（在/不在） */
  function phi(inGroupPresent, inGroupN, outPresent, outN) {
    const a = inGroupPresent, b = outPresent, c = inGroupN - a, d = outN - b;
    const den = Math.sqrt((a + b) * (c + d) * (a + c) * (b + d));
    return den === 0 ? 0 : (a * d - b * c) / den;
  }

  /* 識別種の抽出 */
  function differentials(mat, groups, opts) {
    const minFreq = (opts && opts.minFreq) || 0.5;
    const minPhi = (opts && opts.minPhi) || 0.3;
    const maxOut = (opts && opts.maxOut != null) ? opts.maxOut : 0.35;
    const G = groups.length ? Math.max.apply(null, groups) + 1 : 0;
    const sizes = new Array(G).fill(0); groups.forEach(g => sizes[g]++);
    const info = new Map();
    mat.keys.forEach(k => {
      const row = mat.rows.get(k);
      const pres = new Array(G).fill(0); let tot = 0;
      row.forEach((v, j) => { if (v) { pres[groups[j]]++; tot++; } });
      const per = [];
      for (let g = 0; g < G; g++) {
        const fin = sizes[g] ? pres[g] / sizes[g] : 0;
        const outN = mat.n - sizes[g], outP = tot - pres[g];
        const fout = outN ? outP / outN : 0;
        const p = phi(pres[g], sizes[g], outP, outN);
        per.push({ g, fin, fout, phi: p, diff: G > 1 && fin >= minFreq && p >= minPhi && fout <= maxOut });
      }
      info.set(k, { total: tot, freq: tot / mat.n, per, diffGroups: per.filter(x => x.diff).map(x => x.g) });
    });
    return { info, sizes, G };
  }

  /* 並べ替え済み植生表（区分表）を作成 */
  function sortedTable(releves, opts) {
    const mat = buildMatrix(releves, opts);
    const method = opts.method || 'bray';
    let groups, order, tree = null;
    if (opts.manualGroups && releves.every(r => r.group != null && r.group !== '')) {
      const labels = Array.from(new Set(releves.map(r => String(r.group)))).sort();
      groups = releves.map(r => labels.indexOf(String(r.group)));
      order = releves.map((_, i) => i).sort((a, b) => groups[a] - groups[b] || a - b);
    } else {
      tree = upgma(mat, method);
      const cut = cutTree(tree, Math.min(opts.k || 2, mat.n));
      groups = cut.groups; order = cut.order;
      order = order.slice().sort((a, b) => groups[a] - groups[b] || order.indexOf(a) - order.indexOf(b));
    }
    const diff = differentials(mat, groups, opts);
    const blocks = [];
    // 単一群の識別種ブロック
    for (let g = 0; g < diff.G; g++) {
      const ks = mat.keys.filter(k => { const d = diff.info.get(k).diffGroups; return d.length === 1 && d[0] === g; })
        .sort((a, b) => diff.info.get(b).per[g].phi - diff.info.get(a).per[g].phi);
      blocks.push({ kind: 'diff', groups: [g], keys: ks, title: '群' + groupLabel(g) + 'の識別種' });
    }
    // 複数群に共通する識別種
    const multi = mat.keys.filter(k => diff.info.get(k).diffGroups.length > 1);
    const multiMap = new Map();
    multi.forEach(k => { const sig = diff.info.get(k).diffGroups.join(','); if (!multiMap.has(sig)) multiMap.set(sig, []); multiMap.get(sig).push(k); });
    multiMap.forEach((ks, sig) => blocks.push({ kind: 'diff', groups: sig.split(',').map(Number), keys: ks, title: '群' + sig.split(',').map(x => groupLabel(+x)).join('＋') + 'の識別種' }));
    // 随伴種（頻度順、同頻度は層順）
    const comp = mat.keys.filter(k => diff.info.get(k).diffGroups.length === 0)
      .sort((a, b) => diff.info.get(b).total - diff.info.get(a).total || (LAYER_ORDER[labelOf(a).layer] || 0) - (LAYER_ORDER[labelOf(b).layer] || 0) || a.localeCompare(b, 'ja'));
    blocks.push({ kind: 'comp', groups: [], keys: comp, title: '随伴種' });
    return { mat, groups, order, tree, diff, blocks };
  }

  function groupLabel(g) { return String.fromCharCode(65 + g); }

  function constancyClass(f) {
    if (f <= 0) return '';
    if (f <= 0.2) return 'I'; if (f <= 0.4) return 'II'; if (f <= 0.6) return 'III'; if (f <= 0.8) return 'IV'; return 'V';
  }

  /* 常在度表 */
  function synoptic(result) {
    const { mat, groups, diff } = result;
    const rows = [];
    result.blocks.forEach(b => b.keys.forEach(k => {
      const row = mat.rows.get(k);
      const cells = [];
      for (let g = 0; g < diff.G; g++) {
        const vals = []; row.forEach((v, j) => { if (v && groups[j] === g) vals.push(v.cover); });
        const f = diff.sizes[g] ? vals.length / diff.sizes[g] : 0;
        const order = VEG.COVER_SCALES.bb7.classes.map(c => c.v);
        vals.sort((a, b) => order.indexOf(a) - order.indexOf(b));
        cells.push({ cls: constancyClass(f), f, range: vals.length ? (vals[0] === vals[vals.length - 1] ? vals[0] : vals[0] + '-' + vals[vals.length - 1]) : '', phi: diff.info.get(k).per[g].phi });
      }
      rows.push({ key: k, block: b, cells });
    }));
    return rows;
  }

  /* ---------- 群集の同定（参照DBとの照合） ---------- */
  function contextOf(r, settings) {
    const pref = VEG.PREFS.find(p => p.name === r.pref);
    const zone = r.zoneOverride || VEG.zoneOf(r.pref, r.elev, settings && settings.prefOverrides);
    const sea = r.seaOverride || (pref ? pref.sea : '');
    return { pref, zone, sea, region: pref ? pref.region : '' };
  }

  const ADJ = { ST: ['WE'], WE: ['CD', 'ST'], CD: ['WE', 'SA', 'MX'], MX: ['CD', 'SA'], SA: ['CD', 'MX', 'AL'], AL: ['SA'] };

  function identify(r, syntaxa, settings) {
    const ctx = contextOf(r, settings);
    const present = new Map();
    (r.records || []).forEach(rec => {
      const m = VEG.coverMid(rec.cover);
      present.set(rec.sp, Math.max(present.get(rec.sp) || 0, m));
    });
    if (!present.size) return { ctx, results: [] };
    // 最上層の優占種
    const topLayer = ['T1', 'T2', 'S', 'H', 'M'].find(L => (r.records || []).some(x => x.layer === L));
    let dominant = null, dm = -1;
    (r.records || []).filter(x => x.layer === topLayer).forEach(x => { const m = VEG.coverMid(x.cover); if (m > dm) { dm = m; dominant = x.sp; } });

    const results = syntaxa.map(s => {
      const w = (sp, base) => {
        if (!present.has(sp)) return 0;
        const c = present.get(sp);
        return base * (0.6 + 0.4 * Math.min(1, Math.log10(1 + c) / Math.log10(88.5)));
      };
      let got = 0, max = 0;
      const hitChar = [], hitDiff = [], miss = [];
      (s.char || []).forEach(sp => { max += 3; const v = w(sp, 3); got += v; (v ? hitChar : miss).push(sp); });
      (s.diff || []).forEach(sp => { max += 1.5; const v = w(sp, 1.5); got += v; if (v) hitDiff.push(sp); });
      (s.comp || []).forEach(sp => { max += 0.5; got += w(sp, 0.5); });
      let floristic = max ? got / max : 0;
      if (dominant && s.char && s.char[0] === dominant) floristic = Math.min(1, floristic + 0.15);
      // 地理・植生帯の整合
      let geo = 1; const flags = [];
      if (ctx.zone) {
        if (s.zones.includes(ctx.zone)) geo *= 1;
        else if ((ADJ[ctx.zone] || []).some(z => s.zones.includes(z))) { geo *= 0.75; flags.push('隣接植生帯'); }
        else { geo *= 0.4; flags.push('植生帯が不一致'); }
      }
      if (s.regions && s.regions.length && ctx.region && !s.regions.includes(ctx.region)) { geo *= 0.6; flags.push('分布域外の地方'); }
      if (s.sea && ctx.sea && s.sea !== ctx.sea) { geo *= 0.8; flags.push(s.sea === 'J' ? '日本海側型' : '太平洋側型'); }
      const score = floristic * geo;
      return { s, score, floristic, geo, hitChar, hitDiff, miss, flags };
    }).filter(x => x.hitChar.length + x.hitDiff.length > 0)
      .sort((a, b) => b.score - a.score);
    return { ctx, dominant, results: results.slice(0, 6) };
  }

  /* 地域の候補群集リスト（調査前の参照用） */
  function candidatesFor(prefName, elev, syntaxa, settings) {
    const pref = VEG.PREFS.find(p => p.name === prefName);
    if (!pref) return [];
    const zone = VEG.zoneOf(prefName, elev, settings && settings.prefOverrides);
    return syntaxa.filter(s => s.zones.includes(zone) && (!s.regions.length || s.regions.includes(pref.region)))
      .map(s => ({ s, seaMatch: !s.sea || s.sea === pref.sea }))
      .sort((a, b) => (b.s.stage - a.s.stage) || (b.seaMatch - a.seaMatch));
  }

  return { buildMatrix, distance, upgma, cutTree, differentials, sortedTable, synoptic, identify, contextOf, candidatesFor, groupLabel, labelOf, constancyClass };
})();

/* ===== succession.js ===== */
/* =========================================================
   遷移予測
   現存植生（同定結果＋階層構造）→ 遷移段階を推定し、
   植生帯・立地・管理シナリオに応じて年数ごとの到達植生を示す。
   年数は一般的な文献値をもとにした目安（[早い, 標準, 遅い]）。
   ========================================================= */
'use strict';

window.VEG = window.VEG || {};
VEG.Succession = (function () {

  function layerCover(r, L) {
    const l = (r.layers || {})[L];
    if (l && l.cov !== '' && l.cov != null) return Number(l.cov) || 0;
    let s = 0; (r.records || []).filter(x => x.layer === L).forEach(x => { s = 100 * (1 - (1 - s / 100) * (1 - VEG.coverMid(x.cover) / 100)); });
    return s;
  }
  function spCover(r, names, layers) {
    let s = 0;
    (r.records || []).forEach(x => { if (names.includes(x.sp) && (!layers || layers.includes(x.layer))) s = Math.max(s, VEG.coverMid(x.cover)); });
    return s;
  }
  function dominantOf(r, L) {
    let d = null, m = -1;
    (r.records || []).filter(x => x.layer === L).forEach(x => { const v = VEG.coverMid(x.cover); if (v > m) { m = v; d = x.sp; } });
    return d;
  }

  /* 構造から段階を推定 */
  function structuralStage(r, zone) {
    const t = Math.max(layerCover(r, 'T1'), layerCover(r, 'T2'));
    const s = layerCover(r, 'S');
    const late = VEG.LATE_TREES[zone] || [];
    const lateTop = spCover(r, late, ['T1', 'T2']);
    if (t >= 30) {
      if (lateTop >= 37.5) return 7;
      if (lateTop >= 5) return 6;
      return 5;
    }
    if (s >= 30) return 4;
    const h = dominantOf(r, 'H');
    if (['ススキ', 'チシマザサ', 'クマイザサ', 'ミヤコザサ', 'アズマネザサ', 'ネザサ', 'トダシバ'].includes(h)) return 3;
    const annual = ['メヒシバ', 'エノコログサ', 'アキノエノコログサ', 'オヒシバ', 'ベニバナボロギク', 'ダンドボロギク', 'ヒメムカシヨモギ', 'イヌビエ', 'エノキグサ'];
    if (h && annual.includes(h)) return 1;
    if ((r.records || []).length === 0) return 0;
    return 2;
  }

  /* 段階に対応する群集名（地域DBから選択） */
  function communityFor(stage, ctx, syntaxa, site) {
    const pool = syntaxa.filter(s => s.stage === stage && s.zones.includes(ctx.zone) && s.type !== 'plantation' && s.type !== 'edaphic' &&
      (!s.regions.length || s.regions.includes(ctx.region)));
    let best = null, bs = -1;
    pool.forEach(s => {
      let sc = 1;
      if (s.sea && ctx.sea === s.sea) sc += 1; else if (s.sea && ctx.sea && s.sea !== ctx.sea) sc -= 0.8;
      if (site.dry && /アカマツ/.test(s.ja)) sc += 1.2;
      if (!site.dry && /アカマツ/.test(s.ja)) sc -= 0.5;
      if (s.regions.length) sc += 0.3; // 地方限定の群集を優先
      if (sc > bs) { bs = sc; best = s; }
    });
    return best;
  }

  function climaxFor(ctx, syntaxa, site, r) {
    const pool = syntaxa.filter(s => s.type === 'climax' && s.zones.includes(ctx.zone) && (!s.regions.length || s.regions.includes(ctx.region)));
    const present = new Set((r.records || []).map(x => x.sp));
    let ranked = pool.map(s => {
      let sc = 0; const why = [];
      if (s.zones[0] === ctx.zone) sc += 0.5;
      if (s.sea) { if (s.sea === ctx.sea) { sc += 1; } else sc -= 1.5; }
      const hits = s.char.concat(s.diff).filter(x => present.has(x));
      sc += hits.length * 0.8; if (hits.length) why.push('現地に構成種：' + hits.join('、'));
      if (/タブノキ/.test(s.ja)) { if (site.wet || site.coastal) { sc += 1.2; why.push('湿潤・沿海立地'); } else sc -= 0.3; }
      if (/モミ|ウラジロガシ/.test(s.ja)) { if (site.ridge || site.high) { sc += 1; why.push('尾根・暖温帯上部'); } else sc -= 0.3; }
      if (/シラカシ/.test(s.ja) && ctx.region === '関東' && !site.coastal) { sc += 0.8; why.push('関東内陸'); }
      if (/イヌブナ/.test(s.ja) && !site.lowerCD) sc -= 0.6;
      if (/ハイマツ/.test(s.ja) && ctx.zone !== 'AL') sc -= 2;
      return { s, sc, why };
    }).sort((a, b) => b.sc - a.sc);
    return ranked;
  }

  const SCENARIOS = {
    none: { name: '放置（自然遷移）' },
    mow: { name: '草刈り・採草を継続' },
    clearcut: { name: '皆伐後に放置（萌芽更新）' },
    deer: { name: 'シカ高密度（食害継続）' }
  };

  function predict(r, idResult, syntaxa, settings, scenario) {
    const ctx = VEG.Analysis.contextOf(r, settings);
    const zone = ctx.zone || 'WE';
    const notes = [];
    const site = {
      ridge: /尾根|斜面上部|岩場/.test(r.topo || ''),
      wet: /谷|斜面下部|湿地|低地/.test(r.topo || '') || /湿性|過湿/.test(r.moist || ''),
      wetland: /湿地/.test(r.topo || '') || /過湿/.test(r.moist || '') || /グライ|泥炭/.test(r.soil || ''),
      coastal: /海岸/.test(r.topo || ''),
      dry: /乾性/.test(r.moist || '') || /未熟土/.test(r.soil || '') || /尾根|岩場/.test(r.topo || ''),
      steep: Number(r.slope) >= 35,
      high: false, lowerCD: false
    };
    const p = ctx.pref;
    if (p && zone === 'WE' && Number(r.elev) > p.ev * 0.6) site.high = true;
    if (p && zone === 'CD' && Number(r.elev) < p.ev + 300) site.lowerCD = true;

    // 現在の段階
    const top = idResult && idResult.results && idResult.results[0];
    const sStage = structuralStage(r, zone);
    let stage = sStage, current = null;
    if (top && top.score >= 0.3) {
      current = top.s;
      stage = top.s.stage;
      if (Math.abs(stage - sStage) >= 2) notes.push(`同定群集（${top.s.ja}）の典型段階と、階層構造からの推定（${VEG.STAGES[sStage].short}）が異なります。構造推定を優先しました。`);
      if (Math.abs(stage - sStage) >= 2) stage = sStage;
    }

    // 後継樹（極相構成種）の更新状況
    const late = VEG.LATE_TREES[zone] || [];
    const regen = spCover(r, late, ['T2', 'S', 'H']);
    const regenSp = Array.from(new Set((r.records || []).filter(x => late.includes(x.sp) && ['T2', 'S', 'H'].includes(x.layer)).map(x => x.sp)));
    let factor = 1;
    if (stage >= 4 && stage <= 6) {
      if (regen >= 17.5) { factor *= 0.7; notes.push(`下層に極相構成種（${regenSp.join('、')}）が多く、遷移は速く進む見込みです。`); }
      else if (regen > 0) { factor *= 0.85; notes.push(`下層に極相構成種（${regenSp.join('、')}）が侵入しています。`); }
      else if (stage >= 5) { factor *= 1.3; notes.push('下層に極相構成種が見られません。種子供給源（近隣の自然林）からの距離が遷移速度を左右します。'); }
    }
    // 遷移停滞要因
    const arrest = (r.records || []).filter(x => VEG.ARRESTING.includes(x.sp) && ['S', 'H'].includes(x.layer) && VEG.coverMid(x.cover) >= 62.5);
    if (arrest.length) { factor *= 1.8; notes.push(`林床・低木層で${arrest.map(x => x.sp).join('、')}が高被度（4以上）です。ササ・つる植物の密生は後継樹の定着を妨げ、遷移が停滞しやすくなります。`); }
    if (site.dry) { factor *= 1.25; notes.push('乾性・未熟な立地のため遷移はやや遅く、アカマツ林などの土地的極相に留まる可能性があります。'); }
    if (site.steep) { factor *= 1.15; notes.push('急傾斜のため表土移動が起こりやすく、遷移が遅れる傾向があります。'); }
    if (/シカ/.test(r.impact || '')) { notes.push('シカ食害の記録があります。シナリオ「シカ高密度」も確認してください。'); }

    factor = Math.min(3, factor);
    // 特殊系列（湿地・海岸）
    let series = 'zonal';
    if (site.wetland) series = 'wetland';
    else if (site.coastal && stage <= 3) series = 'coastal';

    const Y = VEG.STAGE_YEARS[zone] || VEG.STAGE_YEARS.WE;
    const maxStage = zone === 'AL' ? 3 : 7;
    let path = [];
    let startStage = stage;
    let capStage = maxStage;
    let scen = scenario || 'none';

    if (scen === 'mow') { capStage = Math.min(maxStage, Math.max(3, Math.min(stage, 3))); if (stage > 3) notes.push('現状が既に林分のため、草刈り継続シナリオは林床管理として扱います（段階は維持）。'); if (stage > 3) capStage = stage; }
    if (scen === 'clearcut') {
      if (stage >= 5) { startStage = 1; notes.push('皆伐後は一年生草本→先駆低木を経て、切株からの萌芽により陽樹二次林へ早く戻ります。'); }
    }
    if (scen === 'deer') { capStage = Math.min(stage, 5); factor *= 1.6; notes.push('シカの採食圧が続くと林床植生が衰退し、不嗜好性植物（イワヒメワラビ、シロダモ、アセビ等）が優占して更新が妨げられます。'); }

    const climaxRank = climaxFor(ctx, syntaxa, site, r);
    const climax = climaxRank[0] ? climaxRank[0].s : null;

    function nameFor(st) {
      if (series === 'wetland') {
        if (st <= 3) return { ja: 'ヨシ群集など湿生草本群落', s: syntaxa.find(s => s.id === 'phragmitetum') };
        if (st <= 5) return { ja: 'ヤナギ・ハンノキ湿生林', s: syntaxa.find(s => s.id === 'alnus-japonica') };
        return { ja: 'ハンノキ群落（立地的極相：地下水位次第）', s: syntaxa.find(s => s.id === 'alnus-japonica') };
      }
      if (series === 'coastal') {
        if (st <= 2) return { ja: 'ハマボウフウ－コウボウムギ群集（前砂丘）', s: syntaxa.find(s => s.id === 'glehnio-caricetum') };
        if (st <= 4) return { ja: 'ハマゴウ群落（後砂丘）', s: syntaxa.find(s => s.id === 'vitex-rotundifolia') };
        if (st <= 6) return { ja: 'トベラ－マサキ群落・クロマツ林', s: syntaxa.find(s => s.id === 'pittosporum-euonymus') };
      }
      if (st === startStage && current && scen !== 'clearcut' && current.stage === st) return { ja: current.ja, s: current };
      if (st === 7 && climax) return { ja: climax.ja, s: climax };
      if (st === 6 && climax) return { ja: VEG.STAGES[6].short + '（' + climax.char[0] + '等の侵入）', s: null };
      const s = communityFor(st, Object.assign({}, ctx, { zone }), syntaxa, site);
      return s ? { ja: s.ja, s } : { ja: VEG.STAGES[st].name, s: null };
    }

    // 時系列
    let acc = [0, 0, 0];
    const yearsInto = Number(r.yearsSince) || 0;
    for (let st = startStage; st <= capStage; st++) {
      const nm = nameFor(st);
      path.push({ stage: st, name: nm.ja, syntaxon: nm.s, start: acc.slice() });
      if (st === capStage) break;
      const d = Y[st].map(v => v * factor);
      // 現段階は経過分を差し引く（同定段階に入ってからの年数が不明なため半分を仮定）
      if (st === startStage) {
        const used = scen === 'clearcut' ? 0 : Math.min(yearsInto, d[1]) * 0.5;
        acc = [acc[0] + Math.max(0, d[0] - used), acc[1] + Math.max(0, d[1] - used), acc[2] + Math.max(0, d[2] - used)];
      } else acc = [acc[0] + d[0], acc[1] + d[1], acc[2] + d[2]];
    }
    // 萌芽更新（皆伐）では二次林までを短縮
    if (scen === 'clearcut') {
      const p5 = path.find(p => p.stage === 5);
      const saved = p5 ? p5.start.map(v => v * 0.4) : [0, 0, 0];
      path.forEach(p => { p.start = p.stage <= 5 ? p.start.map(v => v * 0.6) : p.start.map((v, i) => v - saved[i]); });
    }

    function at(years) {
      const pick = idx => { let r0 = path[0]; path.forEach(p => { if (p.start[idx] <= years) r0 = p; }); return r0; };
      return { early: pick(0), typical: pick(1), late: pick(2) };
    }

    if (stage === 7 && scen === 'none') notes.push('現状は極相林（潜在自然植生に近い林分）と判定されました。大きな攪乱がなければこの植生が持続し、ギャップ更新で維持されます。');
    if (zone === 'AL') notes.push('高山帯では森林への遷移は起こらず、草本・矮性低木群落が持続します。');
    return {
      ctx: Object.assign({}, ctx, { zone }), stage, structuralStage: sStage, current, path, at, notes,
      factor, climax, climaxRank: climaxRank.slice(0, 3), regenSp, series, scenario: scen
    };
  }

  return { predict, structuralStage, SCENARIOS };
})();

'use strict';
(function () {
  const VERSION = '1.0.0';
  const KEY = 'vegsurvey.v1';
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const view = $('#view');
  const GROUP_COLORS = ['--g0', '--g1', '--g2', '--g3', '--g4', '--g5', '--g6', '--g7'];
  const gColor = g => `var(${GROUP_COLORS[g % GROUP_COLORS.length]})`;
  const LAYER_IDS = VEG.LAYERS.map(l => l.id);
  const layerName = id => (VEG.LAYERS.find(l => l.id === id) || {}).name || id;

  /* ---------------- 保存 ---------------- */
  function defaults() {
    return {
      releves: [], features: [], recent: [],
      settings: {
        scale: 'bb7', theme: 'auto', observer: '', prefOverrides: {}, customSyntaxa: [], replaceDB: false,
        table: { merge: false, method: 'bray', k: 2, manual: false, minFreq: 0.5, minPhi: 0.3, tab: 'sorted' }
      }
    };
  }
  function load() {
    try {
      const j = JSON.parse(localStorage.getItem(KEY));
      if (j && Array.isArray(j.releves)) {
        const d = defaults();
        j.settings = Object.assign(d.settings, j.settings || {});
        j.settings.table = Object.assign(d.settings.table, j.settings.table || {});
        j.features = j.features || []; j.recent = j.recent || [];
        return j;
      }
    } catch (e) { /* 初回または破損 */ }
    return defaults();
  }
  let S = load();
  let saveTimer = null;
  function save(now) {
    clearTimeout(saveTimer);
    const run = () => {
      try { localStorage.setItem(KEY, JSON.stringify(S)); }
      catch (e) { toast('端末に保存できませんでした。設定 → バックアップを書き出すで退避してください。'); }
    };
    if (now) run(); else saveTimer = setTimeout(run, 250);
  }
  window.addEventListener('pagehide', () => save(true));

  const syntaxa = () => (S.settings.replaceDB && S.settings.customSyntaxa.length) ? S.settings.customSyntaxa : VEG.SYNTAXA.concat(S.settings.customSyntaxa || []);
  const scale = () => VEG.COVER_SCALES[S.settings.scale] || VEG.COVER_SCALES.bb7;
  const included = () => S.releves.filter(r => r.include !== false);
  const findR = id => S.releves.find(r => r.id === id);

  function applyTheme() {
    const t = S.settings.theme;
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  function refreshSpeciesList() {
    const set = new Set(VEG.buildSpeciesList(syntaxa()));
    S.releves.forEach(r => (r.records || []).forEach(x => set.add(x.sp)));
    $('#splist').innerHTML = Array.from(set).sort((a, b) => a.localeCompare(b, 'ja')).map(n => `<option value="${esc(n)}">`).join('');
  }

  /* ---------------- 共通UI ---------------- */
  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type: type || 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  const csvCell = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const toCSV = rows => '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const today = () => new Date().toISOString().slice(0, 10);
  const opts = (arr, sel) => arr.map(v => `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(v || '—')}</option>`).join('');

  function updateNet() {
    const n = $('#netStatus');
    if (navigator.onLine) { n.textContent = 'オンライン'; n.classList.remove('off'); }
    else { n.textContent = 'オフライン'; n.classList.add('off'); }
  }
  window.addEventListener('online', updateNet); window.addEventListener('offline', updateNet);

  function layerCov(r, L) {
    const l = (r.layers || {})[L];
    if (l && l.cov !== '' && l.cov != null) return Math.min(100, Number(l.cov) || 0);
    let s = 0; (r.records || []).filter(x => x.layer === L).forEach(x => { s = 100 * (1 - (1 - s / 100) * (1 - VEG.coverMid(x.cover) / 100)); });
    return s;
  }
  function strataHTML(r) {
    return `<div class="strata" title="階層ごとの植被率">${LAYER_IDS.map(L => `<i data-l="${L}" style="--w:${layerCov(r, L).toFixed(0)}%" title="${layerName(L)} ${layerCov(r, L).toFixed(0)}%"></i>`).join('')}</div>`;
  }
  function newCode() {
    let n = 0; S.releves.forEach(r => { const m = /(\d+)$/.exec(r.code || ''); if (m) n = Math.max(n, +m[1]); });
    return 'R' + String(n + 1).padStart(3, '0');
  }
  function blankReleve(base) {
    const r = {
      id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), code: newCode(), date: today(),
      observer: S.settings.observer || '', site: '', pref: '', lat: '', lng: '', elev: '', slope: '', aspect: '', topo: '', soil: '', moist: '',
      plotType: 'forest', size: '', area: '', impact: '', yearsSince: '', notes: '', include: true, group: '',
      layers: {}, records: [], createdAt: Date.now(), updatedAt: Date.now()
    };
    LAYER_IDS.forEach(L => { r.layers[L] = { h: '', cov: '' }; });
    if (base) ['observer', 'site', 'pref', 'lat', 'lng', 'elev', 'slope', 'aspect', 'topo', 'soil', 'moist', 'plotType', 'impact', 'yearsSince'].forEach(k => { r[k] = base[k]; });
    return r;
  }
  function topCommunity(r) {
    const id = VEG.Analysis.identify(r, syntaxa(), S.settings);
    const t = id.results[0];
    return t && t.score >= 0.2 ? { name: t.s.ja, score: t.score, s: t.s } : null;
  }

  /* ---------------- ルーティング ---------------- */
  function route() {
    const h = (location.hash || '#list').slice(1);
    const [name, arg] = h.split('/');
    $$('.tabbar a').forEach(a => a.setAttribute('aria-current', (a.dataset.tab === name || (name === 'edit' && a.dataset.tab === 'list')) ? 'page' : 'false'));
    if (mapObj) { mapObj.remove(); mapObj = null; }

    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  /* =========================================================
     調査区一覧
     ========================================================= */
  function renderList() {
    const rs = S.releves;
    if (!rs.length) {
      view.innerHTML = `
        <h1>調査区</h1>
        <div class="empty panel">
          <p>まだ調査区がありません。現地で「新しい調査区」を作成し、階層ごとに出現種と被度・群度を記録します。</p>
          <button class="btn primary" id="btnNew">新しい調査区</button>
          <button class="btn" id="btnSample">サンプルデータで試す</button>
        </div>
        ${guideHTML()}`;
      $('#btnNew').onclick = createNew;
      $('#btnSample').onclick = () => { S.releves = S.releves.concat(VEG.sampleReleves()); save(true); refreshSpeciesList(); toast('サンプル8地点を読み込みました'); renderList(); };
      return;
    }
    const inc = included().length;
    view.innerHTML = `
      <div class="spread"><h1>調査区</h1><button class="btn primary" id="btnNew">新しい調査区</button></div>
      <p class="lead">${rs.length}地点（解析対象 ${inc}地点）。カード左の柱は上から高木・亜高木・低木・草本・コケ層の植被率です。</p>
      <div class="row noprint" style="margin-bottom:12px">
        <input type="search" id="q" placeholder="地点名・番号・種名で絞り込み" style="flex:1;min-width:200px">
      </div>
      <ul class="rlist" id="rlist"></ul>
      <details class="panel" style="margin-top:14px"><summary>調査方法の目安</summary>${guideHTML(true)}</details>`;
    $('#btnNew').onclick = createNew;
    const draw = () => {
      const q = $('#q').value.trim();
      const list = rs.filter(r => !q || [r.code, r.site, r.pref].concat((r.records || []).map(x => x.sp)).some(v => String(v || '').includes(q)))
        .sort((a, b) => String(a.code).localeCompare(String(b.code), 'ja', { numeric: true }));

      const li = e.target.closest('.rcard'); if (!li) return;
      const r = findR(li.dataset.id);
      if (e.target.dataset.act === 'clone') { const n = blankReleve(r); S.releves.push(n); save(true); location.hash = '#edit/' + n.id; }
    };
    $('#rlist').onchange = e => {
      if (e.target.dataset.act !== 'inc') return;
      const r = findR(e.target.closest('.rcard').dataset.id); r.include = e.target.checked; save(); draw();
    };
  }
  function createNew() { const r = blankReleve(); S.releves.push(r); save(true); location.hash = '#edit/' + r.id; }

  function guideHTML(inner) {
    const g = VEG.PLOT_GUIDE.map(p => `<tr><td>${esc(p.name)}</td><td>${p.min}〜${p.max} m²</td><td>${esc(p.note)}</td></tr>`).join('');
    const body = `
      <h3>調査区の設定</h3>
      <p>相観・種組成が均質に見える場所を選び、林縁や踏み跡を避けます。面積は群落の種類に応じて揃えると比較しやすくなります。</p>
      <table class="plain"><thead><tr><th>群落</th><th>面積</th><th>区画の例</th></tr></thead><tbody>${g}</tbody></table>
      <h3>記録の順序</h3>
      <p>環境情報（位置・標高・傾斜・方位・土壌）→ 階層ごとの高さと植被率 → 階層ごとに出現種と被度・群度、の順で記録します。同じ種が複数の層に出現する場合は層ごとに記録します。</p>
      <h3>被度と群度</h3>
      <table class="plain"><tbody>${VEG.COVER_SCALES.bb7.classes.map(c => `<tr><td><b>${c.v}</b></td><td>${esc(c.desc)}</td></tr>`).join('')}</tbody></table>
      <p class="small muted" style="margin-top:8px">群度：${VEG.SOCIABILITY.map(s => s.v + '＝' + s.desc).join('、')}</p>`;
    return inner ? body : `<section class="panel">${body}</section>`;
  }

            ${f('size', '区画（例 10×10）')}

          <tbody>${VEG.LAYERS.map(L => `<tr><td><b>${esc(L.name)}</b><br><span class="small muted">${esc(L.hint)}</span></td>

      <section class="panel entry" aria-label="出現種の入力">

        <div class="sprow-input" style="margin:8px 0">

          <div class="lbl">群度</div><div class="seg" id="segSoc">${VEG.SOCIABILITY.map(s => `<button type="button" data-v="${s.v}" title="${esc(s.desc)}" aria-pressed="${entry.soc === s.v}">${s.v}</button>`).join('')}</div>

      </section>`;

    const touch = () => { r.updatedAt = Date.now(); save(); };
    view.addEventListener('input', onInput);
    view.addEventListener('change', onInput);
    function onInput(e) {
      const t = e.target;
      if (t.dataset.f) {
        r[t.dataset.f] = t.value; touch();
        if (t.dataset.f === 'size') {
          const m = /^\s*([\d.]+)\s*[x×*]\s*([\d.]+)\s*$/i.exec(t.value);
          if (m) { r.area = +(m[1] * m[2]).toFixed(2); $('[data-f=area]').value = r.area; }
        }
        if (['pref', 'elev'].includes(t.dataset.f)) { zoneInfo(); cand(); idPreview(); }
        if (['plotType', 'area', 'size'].includes(t.dataset.f)) areaMsg();
        if (t.dataset.f === 'code') $('h1').textContent = '調査区 ' + t.value;
      } else if (t.dataset.lay) {
        r.layers[t.dataset.lay][t.dataset.k] = t.value; touch();
      } else if (t.dataset.idx != null && t.dataset.k) {
        r.records[+t.dataset.idx][t.dataset.k] = t.value; touch(); spList(); idPreview();
      }
    }
    // 画面遷移時にリスナーを外す
    const off = () => { view.removeEventListener('input', onInput); view.removeEventListener('change', onInput); window.removeEventListener('hashchange', off); };
    window.addEventListener('hashchange', off);

    function zoneInfo() {
      const ctx = VEG.Analysis.contextOf(r, S.settings);
      $('#zoneInfo').textContent = ctx.zone ? `推定植生帯：${VEG.ZONES[ctx.zone].name}（${ctx.region}、${ctx.sea === 'J' ? '日本海側' : '太平洋側'}型の目安）` : '都道府県と標高を入れると植生帯を推定します。';
    }
    function areaMsg() {
      const g = VEG.PLOT_GUIDE.find(p => p.type === r.plotType); const a = Number(r.area);
      const el = $('#areaMsg');
      if (!g) { el.textContent = ''; return; }
      if (!a) { el.innerHTML = `<span class="muted">${esc(g.name)}の目安：${g.min}〜${g.max} m²（${esc(g.note)}）</span>`; return; }
      el.innerHTML = a < g.min ? `<span class="note" style="display:block">面積が${esc(g.name)}の目安（${g.min}〜${g.max} m²）より小さく、種数を過小評価する恐れがあります。</span>`
        : a > g.max ? `<span class="note" style="display:block">面積が目安（${g.min}〜${g.max} m²）より大きく、異質な植生を含む恐れがあります。</span>`
          : `<span class="muted">目安（${g.min}〜${g.max} m²）の範囲内です。</span>`;
    }
    function spList() {
      const recs = r.records.map((x, i) => Object.assign({ i }, x));
      $('#spCount').textContent = `${new Set(r.records.map(x => x.sp)).size}種、${r.records.length}記録`;
      const cls = scale().classes.map(c => c.v);
      $('#spList').innerHTML = LAYER_IDS.map(L => {
        const rows = recs.filter(x => x.layer === L).sort((a, b) => VEG.coverMid(b.cover) - VEG.coverMid(a.cover));
        const dom = rows[0] ? rows[0].sp : '';
        const td = $(`[data-dom="${L}"]`); if (td) td.textContent = dom;
        if (!rows.length) return '';
        return `<div class="splayer" data-l="${L}"><h3>${esc(layerName(L))} <span class="small muted">${rows.length}種</span></h3>
          ${rows.map(x => `<div class="sprow"><span>${esc(x.sp)}</span>
            <select data-idx="${x.i}" data-k="cover" aria-label="${esc(x.sp)}の被度">${opts(cls.includes(x.cover) ? cls : cls.concat([x.cover]), x.cover)}</select>
            <select data-idx="${x.i}" data-k="soc" aria-label="${esc(x.sp)}の群度">${opts(['1', '2', '3', '4', '5'], x.soc)}</select>
            <button class="x" data-del="${x.i}" aria-label="${esc(x.sp)}を削除">×</button></div>`).join('')}</div>`;
      }).join('') || '<p class="muted">下の入力欄で階層を選び、種名・被度・群度を入れて「追加」します。</p>';
    }
    function cand() {
      const box = $('#cand');
      if (!r.pref) { box.innerHTML = '<p class="muted small">都道府県を選ぶと、植生帯と地方に合う群集の候補を表示します。種名をタップすると入力欄に入ります。</p>'; return; }
      const list = VEG.Analysis.candidatesFor(r.pref, r.elev, syntaxa(), S.settings);
      box.innerHTML = list.map(({ s, seaMatch }) => `<div class="cand"><b>${esc(s.ja)}</b> <span class="badge">${esc(VEG.STAGES[s.stage].short)}</span>${seaMatch ? '' : '<span class="flag">' + (s.sea === 'J' ? '日本海側型' : '太平洋側型') + '</span>'}
        <div class="chips" style="margin-top:6px">${s.char.map(n => `<button class="chip char" data-sp="${esc(n)}">${esc(n)}</button>`).join('')}${s.diff.map(n => `<button class="chip" data-sp="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>`).join('') || '<p class="muted">該当する群集が参照DBにありません。</p>';
    }
    function idPreview() {
      const res = VEG.Analysis.identify(r, syntaxa(), S.settings);
      const box = $('#idPreview');
      if (!res.results.length) { box.innerHTML = '<p class="muted small">種を記録すると、参照DBとの照合結果がここに出ます。</p>'; return; }
      box.innerHTML = res.results.slice(0, 3).map((x, i) => `<div class="cand${i === 0 ? ' top' : ''}"><div class="spread"><b>${esc(x.s.ja)}</b><span>${Math.round(x.score * 100)}%</span></div>
        <div class="bar"><i style="width:${Math.round(x.score * 100)}%"></i></div>
        <div class="small muted">一致：${esc(x.hitChar.concat(x.hitDiff).join('、'))}${x.miss.length ? '／未確認：' + esc(x.miss.join('、')) : ''}</div></div>`).join('') +
        `<p class="small muted" style="margin-top:6px">未確認の標徴種が調査区外に生えていないか確認すると、判定の精度が上がります。</p>`;
    }
    function recent() {
      $('#recent').innerHTML = (S.recent || []).slice(0, 14).map(n => `<button class="chip" data-sp="${esc(n)}">${esc(n)}</button>`).join('');
    }
    function add() {
      const sp = $('#spIn').value.trim().replace(/\s+/g, '');
      if (!sp) { toast('種名を入力してください'); $('#spIn').focus(); return; }
      const ex = r.records.find(x => x.sp === sp && x.layer === entry.layer);
      if (ex) { ex.cover = entry.cover; ex.soc = entry.soc; toast(`${sp}（${layerName(entry.layer)}）を更新しました`); }
      else { r.records.push({ sp, layer: entry.layer, cover: entry.cover, soc: entry.soc }); toast(`${sp}（${layerName(entry.layer)} ${entry.cover}・${entry.soc}）を追加しました`); }
      S.recent = [sp].concat((S.recent || []).filter(n => n !== sp)).slice(0, 30);
      touch(); spList(); idPreview(); recent();
      $('#spIn').value = ''; entry.cover = '+'; entry.soc = '1';
      $$('#segCover button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === entry.cover));
      $$('#segSoc button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === entry.soc));
      $('#spIn').focus();
    }
    const segBind = (sel, key, attr) => { $(sel).onclick = e => { const b = e.target.closest('button'); if (!b) return; entry[key] = b.dataset[attr]; $$(sel + ' button').forEach(x => x.setAttribute('aria-pressed', x === b)); }; };
    segBind('#segLayer', 'layer', 'l'); segBind('#segCover', 'cover', 'v'); segBind('#segSoc', 'soc', 'v');
    $('#btnAdd').onclick = add;
    $('#spIn').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
    view.onclick = e => {
      const chip = e.target.closest('[data-sp]');
      if (chip) { $('#spIn').value = chip.dataset.sp; $('#spIn').focus(); return; }
      const del = e.target.closest('[data-del]');
      if (del) { const i = +del.dataset.del; const x = r.records[i]; r.records.splice(i, 1); touch(); spList(); idPreview(); toast(`${x.sp}を削除しました`); }
    };
    $('#btnDel').onclick = () => {
      if (!confirm(`調査区 ${r.code} を削除します。元に戻せません。`)) return;
      S.releves = S.releves.filter(x => x !== r); save(true); location.hash = '#list';
    };
    $('#btnGPS').onclick = () => {
      if (!navigator.geolocation) { $('#gpsMsg').textContent = 'この端末は位置情報に対応していません。'; return; }
      $('#gpsMsg').textContent = '測位中…';
      navigator.geolocation.getCurrentPosition(p => {
        r.lat = +p.coords.latitude.toFixed(6); r.lng = +p.coords.longitude.toFixed(6);
        $('[data-f=lat]').value = r.lat; $('[data-f=lng]').value = r.lng;
        if (p.coords.altitude != null && r.elev === '') { r.elev = Math.round(p.coords.altitude); $('[data-f=elev]').value = r.elev; }
        $('#gpsMsg').textContent = `誤差 約${Math.round(p.coords.accuracy)}m` + (p.coords.altitude != null ? '（GPS標高は誤差が大きいため要確認）' : '');
        touch(); zoneInfo();
      }, err => { $('#gpsMsg').textContent = '取得できませんでした：' + err.message; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    };
    $('#btnElev').onclick = async () => {
      if (!r.lat || !r.lng) { toast('先に緯度・経度を入れてください'); return; }
      if (!navigator.onLine) { toast('オフラインのため取得できません。標高は地形図などで確認してください。'); return; }
      $('#gpsMsg').textContent = '取得中…';
      try {
        const e1 = await fetch(`https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${r.lng}&lat=${r.lat}&outtype=JSON`).then(x => x.json());
        if (typeof e1.elevation === 'number') { r.elev = Math.round(e1.elevation); $('[data-f=elev]').value = r.elev; }
        const g = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${r.lat}&lon=${r.lng}`).then(x => x.json());
        const cd = g && g.results && g.results.muniCd ? String(g.results.muniCd).padStart(5, '0') : '';
        if (cd) { const p = VEG.PREFS[parseInt(cd.slice(0, 2), 10) - 1]; if (p) { r.pref = p.name; $('[data-f=pref]').value = p.name; } }
        $('#gpsMsg').textContent = '国土地理院のデータから取得しました';
        touch(); zoneInfo(); cand(); idPreview();
      } catch (err) { $('#gpsMsg').textContent = '取得に失敗しました。通信状況を確認してください。'; }
    };
    zoneInfo(); areaMsg(); spList(); cand(); idPreview(); recent();
  }

  /* =========================================================
     植生表
     ========================================================= */
  let lastTable = null;
  function computeTable() {
    const rs = included();
    const t = S.settings.table;
    if (rs.length < 1) return null;
    const res = VEG.Analysis.sortedTable(rs, { mergeLayers: t.merge, method: t.method, k: Math.max(1, Math.min(t.k, rs.length)), manualGroups: t.manual, minFreq: +t.minFreq, minPhi: +t.minPhi });
    res.releves = rs;
    lastTable = res;
    return res;
  }
  function renderTable() {
    const rs = included();
    if (rs.length < 2) {
      view.innerHTML = `<h1>植生表</h1><div class="empty panel"><p>植生表を作るには、解析に含める調査区が2地点以上必要です（現在 ${rs.length}地点）。</p><a class="btn primary" href="#list">調査区へ</a></div>`;
      return;
    }
    const t = S.settings.table;
    view.innerHTML = `
      <h1>植生表</h1>
      <p class="lead">素表から、調査区を類似度で群に分け、群ごとの識別種をまとめた区分表を作ります。群数や閾値を変えて、まとまりの良い区分を探してください。</p>
      <section class="panel noprint">
        <div class="grid2">
          <label class="f"><span>表の種類</span><select id="tTab">${opts(['raw', 'sorted', 'synoptic', 'dendro'], t.tab).replace(/>raw</, '>素表（出現種リスト）<').replace(/>sorted</, '>区分表（並べ替え済み）<').replace(/>synoptic</, '>常在度表<').replace(/>dendro</, '>樹形図（類似度）<')}</select></label>
          <label class="f"><span>群の数</span><input type="number" id="tK" min="1" max="${rs.length}" value="${t.k}" ${t.manual ? 'disabled' : ''}></label>
        </div>
        <details style="margin-top:10px"><summary class="small" style="cursor:pointer;font-weight:700">区分の条件と書き出し</summary>
          <div class="grid2" style="margin-top:8px">
            <label class="f"><span>類似度</span><select id="tMethod"><option value="bray"${t.method === 'bray' ? ' selected' : ''}>Bray-Curtis（被度を考慮）</option><option value="jaccard"${t.method === 'jaccard' ? ' selected' : ''}>Jaccard（在・不在）</option></select></label>
            <label class="f"><span>識別種の出現頻度（群内）</span><input type="number" id="tMinFreq" step="0.05" min="0.2" max="1" value="${t.minFreq}"></label>
            <label class="f"><span>識別種のφ係数</span><input type="number" id="tMinPhi" step="0.05" min="0" max="1" value="${t.minPhi}"></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label class="btn sm ghost"><input type="checkbox" id="tMerge" ${t.merge ? 'checked' : ''}> 階層を統合して種単位で集計</label>
            <label class="btn sm ghost"><input type="checkbox" id="tManual" ${t.manual ? 'checked' : ''}> 群を手動で指定</label>
            <button class="btn sm" id="tCSV">表をCSVで書き出す</button>
            <button class="btn sm" onclick="window.print()">印刷</button>
          </div>
        </details>
        <div id="manualBox"></div>
      </section>
      <div id="tOut"></div>`;
    const redraw = () => {
      const res = computeTable();
      drawManual(res);
      const out = $('#tOut');
      if (t.tab === 'raw') out.innerHTML = rawTableHTML(res);
      else if (t.tab === 'synoptic') out.innerHTML = synopticHTML(res);
      else if (t.tab === 'dendro') out.innerHTML = dendroHTML(res);
      else out.innerHTML = sortedTableHTML(res);
    };
    const bind = (id, key, conv) => { $(id).onchange = e => { t[key] = conv(e.target); save(); if (key === 'manual') { $('#tK').disabled = t.manual; } redraw(); }; };
    bind('#tTab', 'tab', el => el.value); bind('#tK', 'k', el => Math.max(1, Math.min(rs.length, parseInt(el.value, 10) || 1)));
    bind('#tMethod', 'method', el => el.value); bind('#tMinFreq', 'minFreq', el => +el.value); bind('#tMinPhi', 'minPhi', el => +el.value);
    bind('#tMerge', 'merge', el => el.checked); bind('#tManual', 'manual', el => el.checked);
    $('#tCSV').onclick = () => { const res = lastTable; download(`vegetation_table_${t.tab}_${today()}.csv`, toCSV(tableRows(res, t.tab)), 'text/csv'); };
    function drawManual(res) {
      const box = $('#manualBox');
      if (!t.manual) { box.innerHTML = ''; return; }
      box.innerHTML = `<p class="small muted" style="margin-top:10px">各調査区の群名（A, B…など任意の文字）を入れてください。未入力があると自動区分に戻ります。</p>
        <div class="row">${rs.map(r => `<label class="f" style="width:96px"><span>${esc(r.code)}</span><input type="text" data-g="${esc(r.id)}" value="${esc(r.group || '')}" maxlength="6"></label>`).join('')}</div>`;
      box.onchange = e => { const r = findR(e.target.dataset.g); if (r) { r.group = e.target.value.trim(); save(); redraw(); } };
    }
    redraw();
  }

  const cellText = v => v ? `${v.cover}${v.soc ? '・' + v.soc : ''}` : '';
  function spLabelHTML(k, merge) { const { sp, layer } = VEG.Analysis.labelOf(k); return `${esc(sp)}${!merge && layer ? `<span class="ly">${esc(layerName(layer))}</span>` : ''}`; }

  function headerRows(res, order, withGroups) {
    const rs = res.releves;
    const gs = res.groups;
    const gstart = j => withGroups && j > 0 && gs[order[j]] !== gs[order[j - 1]];
    const nsp = r => new Set((r.records || []).map(x => x.sp)).size;
    return `<thead>
      ${withGroups ? `<tr><th class="sp">群</th>${order.map((i, j) => `<th class="${gstart(j) ? 'gstart' : ''}">${j === 0 || gstart(j) ? `<span class="gl" style="--gc:${gColor(gs[i])}">${VEG.Analysis.groupLabel(gs[i])}</span>` : ''}</th>`).join('')}</tr>` : ''}
      <tr><th class="sp">調査区番号</th>${order.map((i, j) => `<th class="${gstart(j) ? 'gstart' : ''}">${esc(rs[i].code)}</th>`).join('')}</tr>
      <tr><th class="sp">面積 m² ／ 種数</th>${order.map((i, j) => `<th class="${gstart(j) ? 'gstart' : ''}" style="font-weight:400">${esc(rs[i].area || '-')}／${nsp(rs[i])}</th>`).join('')}</tr>
    </thead>`;
  }
  function rawTableHTML(res) {
    const order = res.releves.map((_, i) => i);
    const LO = { T1: 0, T2: 1, S: 2, H: 3, M: 4 };
    const keys = res.mat.keys.slice().sort((a, b) => {
      const la = VEG.Analysis.labelOf(a).layer, lb = VEG.Analysis.labelOf(b).layer;
      return (LO[la] || 0) - (LO[lb] || 0) || res.diff.info.get(b).total - res.diff.info.get(a).total || a.localeCompare(b, 'ja');
    });
    return `<p class="small muted">入力順に並べた素表です。値は「被度・群度」。</p><div class="tablewrap"><table class="veg">${headerRows(res, order, false)}<tbody>
      ${keys.map(k => `<tr><th class="sp">${spLabelHTML(k, S.settings.table.merge)}</th>${order.map(i => { const v = res.mat.rows.get(k)[i]; return `<td class="${v ? 'on' : ''}">${cellText(v)}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  }
  function sortedTableHTML(res) {
    const order = res.order, gs = res.groups;
    const gstart = j => j > 0 && gs[order[j]] !== gs[order[j - 1]];
    const merge = S.settings.table.merge;
    const nDiff = res.blocks.filter(b => b.kind === 'diff').reduce((a, b) => a + b.keys.length, 0);
    const body = res.blocks.filter(b => b.keys.length).map(b => `
      <tr class="block"><th class="sp" colspan="1">${esc(b.title)}（${b.keys.length}）</th>${order.map((_, j) => `<td class="${gstart(j) ? 'gstart' : ''}"></td>`).join('')}</tr>
      ${b.keys.map(k => `<tr><th class="sp">${spLabelHTML(k, merge)}</th>${order.map((i, j) => {
        const v = res.mat.rows.get(k)[i];
        const inBlk = b.kind === 'diff' && b.groups.includes(gs[i]);
        return `<td class="${v ? 'on' : ''}${inBlk ? ' blk' : ''}${gstart(j) ? ' gstart' : ''}" ${inBlk ? `style="--gc:${gColor(gs[i])}"` : ''}>${cellText(v)}</td>`;
      }).join('')}</tr>`).join('')}`).join('');
    const sizes = res.diff.sizes.map((n, g) => `群${VEG.Analysis.groupLabel(g)}：${n}地点`).join('、');
    return `<p class="small muted">${sizes}。識別種 ${nDiff}種。網掛けは識別種のまとまり（同居パターン）です。${nDiff === 0 ? '識別種が抽出されない場合は群の数を減らすか、閾値を下げてください。' : ''}</p>
      <div class="tablewrap"><table class="veg">${headerRows(res, order, true)}<tbody>${body}</tbody></table></div>
      ${groupIdHTML(res)}`;
  }
  /* 群ごとの合成調査区（出現頻度40%以上の種）で群集を判定 */
  function groupSynthetic(res, g) {
    const idx = res.releves.map((_, i) => i).filter(i => res.groups[i] === g);
    const base = res.releves[idx[0]];
    const recs = [];
    res.mat.keys.forEach(k => {
      const vals = idx.map(i => res.mat.rows.get(k)[i]).filter(Boolean);
      if (vals.length / idx.length >= 0.4) {
        vals.sort((a, b) => a.mid - b.mid);
        const med = vals[Math.floor(vals.length / 2)];
        const { sp, layer } = VEG.Analysis.labelOf(k);
        recs.push({ sp, layer: layer || 'H', cover: med.cover, soc: med.soc });
      }
    });
    return Object.assign({}, base, { records: recs });
  }
  function groupIdHTML(res) {
    if (!res.diff.G) return '';
    const rows = [];
    for (let g = 0; g < res.diff.G; g++) {
      const syn = groupSynthetic(res, g);
      const id = VEG.Analysis.identify(syn, syntaxa(), S.settings);
      const t = id.results[0];
      const codes = res.releves.filter((_, i) => res.groups[i] === g).map(r => r.code).join(', ');
      rows.push(`<div class="cand"><div class="spread"><span><span class="gl" style="--gc:${gColor(g)};color:#fff;background:var(--gc);border-radius:4px;padding:0 6px;font-weight:800">${VEG.Analysis.groupLabel(g)}</span> ${t ? '<b>' + esc(t.s.ja) + '</b> <span class="small muted">' + esc(t.s.la) + '</span>' : '<span class="muted">該当なし</span>'}</span>${t ? `<span>${Math.round(t.score * 100)}%</span>` : ''}</div>
        <div class="small muted">${esc(codes)}${t && t.flags.length ? '／' + esc(t.flags.join('、')) : ''}</div></div>`);
    }
    return `<section class="panel" style="margin-top:14px"><h2>群ごとの群集判定</h2>${rows.join('')}<p class="small muted">群内で出現頻度40%以上の種を合成して参照DBと照合しています。</p></section>`;
  }
  function synopticHTML(res) {
    const syn = VEG.Analysis.synoptic(res);
    const G = res.diff.G, merge = S.settings.table.merge;
    let lastBlock = null;
    const body = syn.map(row => {
      let head = '';
      if (row.block !== lastBlock) { lastBlock = row.block; head = `<tr class="block"><th class="sp">${esc(row.block.title)}</th>${Array(G).fill('<td></td>').join('')}</tr>`; }
      return head + `<tr><th class="sp">${spLabelHTML(row.key, merge)}</th>${row.cells.map((c, g) => {
        const inBlk = row.block.kind === 'diff' && row.block.groups.includes(g);
        return `<td class="${c.cls ? 'on' : ''}${inBlk ? ' blk' : ''}" ${inBlk ? `style="--gc:${gColor(g)}"` : ''}>${c.cls}${c.range ? '<sup>' + esc(c.range) + '</sup>' : ''}</td>`;
      }).join('')}</tr>`;
    }).join('');
    return `<p class="small muted">常在度：I ≤20%、II ≤40%、III ≤60%、IV ≤80%、V &gt;80%。右肩は被度の範囲。</p>
      <div class="tablewrap"><table class="veg"><thead><tr><th class="sp">群</th>${res.diff.sizes.map((n, g) => `<th><span class="gl" style="--gc:${gColor(g)}">${VEG.Analysis.groupLabel(g)}</span></th>`).join('')}</tr>
      <tr><th class="sp">調査区数</th>${res.diff.sizes.map(n => `<th>${n}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
  function dendroHTML(res) {
    if (!res.tree) return '<p class="note">群を手動指定しているため樹形図はありません。</p>';
    const order = []; (function w(n) { if (!n.left) order.push(n.id); else { w(n.left); w(n.right); } })(res.tree);
    const rowH = 26, left = 90, W = 560, H = order.length * rowH + 30;
    const maxH = res.tree.height || 1;
    const xOf = h => left + (W - left - 20) * (h / maxH);
    const yLeaf = {}; order.forEach((id, i) => { yLeaf[id] = 15 + i * rowH + rowH / 2; });
    const lines = [];
    (function draw(n) {
      if (!n.left) return { x: xOf(0), y: yLeaf[n.id] };
      const a = draw(n.left), b = draw(n.right), x = xOf(n.height);
      lines.push(`<path d="M${a.x},${a.y}H${x}V${b.y}H${b.x}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`);
      return { x, y: (a.y + b.y) / 2 };
    })(res.tree);
    const labels = order.map(id => `<text x="${left - 8}" y="${yLeaf[id] + 4}" text-anchor="end" font-size="13" font-weight="700" fill="${gColor(res.groups[id])}" style="fill:${gColor(res.groups[id])}">${esc(res.releves[id].code)}</text>`).join('');
    const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => `<text x="${xOf(maxH * f)}" y="${H - 4}" font-size="11" text-anchor="middle" fill="var(--muted)">${(maxH * f).toFixed(2)}</text>`).join('');
    return `<p class="small muted">UPGMA法（${S.settings.table.method === 'jaccard' ? 'Jaccard距離' : 'Bray-Curtis距離、被度中央値の平方根'}）。右に行くほど非類似。色は区分された群です。</p>
      <div class="tablewrap" style="padding:8px"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:340px" role="img" aria-label="調査区の樹形図">${lines.join('')}${labels}${ticks}</svg></div>`;
  }
  function tableRows(res, tab) {
    const merge = S.settings.table.merge;
    const nameOf = k => { const { sp, layer } = VEG.Analysis.labelOf(k); return [sp, merge ? '' : layerName(layer)]; };
    if (tab === 'synoptic') {
      const syn = VEG.Analysis.synoptic(res);
      return [['区分', '種名', '階層'].concat(res.diff.sizes.map((n, g) => '群' + VEG.Analysis.groupLabel(g) + '(n=' + n + ')'))]
        .concat(syn.map(row => [row.block.title].concat(nameOf(row.key), row.cells.map(c => c.cls + (c.range ? ' ' + c.range : '')))));
    }
    const order = tab === 'raw' ? res.releves.map((_, i) => i) : res.order;
    const head = [['区分', '種名', '階層'].concat(order.map(i => res.releves[i].code))];
    if (tab !== 'raw') head.push(['群', '', ''].concat(order.map(i => VEG.Analysis.groupLabel(res.groups[i]))));
    head.push(['面積(m2)', '', ''].concat(order.map(i => res.releves[i].area)));
    const blocks = tab === 'raw' ? [{ title: '', keys: res.mat.keys }] : res.blocks;
    blocks.forEach(b => b.keys.forEach(k => head.push([b.title].concat(nameOf(k), order.map(i => cellText(res.mat.rows.get(k)[i]))))));
    return head;
  }

  /* =========================================================

    const r = findR(id) || rs[0];
    view.innerHTML = `
      <h1>判定・遷移</h1>

      <label class="f" style="max-width:420px;margin-bottom:12px"><span>調査区</span><select id="aSel">${rs.map(x => `<option value="${esc(x.id)}"${x === r ? ' selected' : ''}>${esc(x.code)}　${esc(x.site || '')}</option>`).join('')}</select></label>
      <div class="twocol"><div>

      </div><div>
        <section class="panel"><h2>遷移の予測</h2>
          <div class="grid2">
            <label class="f"><span>管理シナリオ</span><select id="scen">${Object.entries(VEG.Succession.SCENARIOS).map(([k, v]) => `<option value="${k}"${k === anaState.scenario ? ' selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>
            <label class="f"><span>経過年数：<b id="yv">${anaState.years}</b>年後</span><input type="range" id="yrs" min="0" max="200" step="5" value="${anaState.years}"></label>
          </div>
          <div id="sucBox"></div>

    let idRes = null, pred = null;
    function drawCtx() {

      $('#ctxPanel').innerHTML = `<h2>立地と植生帯</h2>
        <dl class="kv"><dt>地点</dt><dd>${esc(r.pref || '未設定')}　${esc(r.site || '')}</dd><dt>標高・傾斜</dt><dd>${esc(r.elev || '-')} m、${esc(r.slope || '-')}°、${esc(r.aspect || '-')}</dd>
        <dt>微地形・土壌</dt><dd>${esc(r.topo || '-')}、${esc(r.soil || '-')}、${esc(r.moist || '-')}</dd><dt>人為的影響</dt><dd>${esc(r.impact || '-')}${r.yearsSince ? '（' + esc(r.yearsSince) + '年経過）' : ''}</dd></dl>
        <div class="grid2" style="margin-top:10px">
          <label class="f"><span>植生帯（推定：${ctx.zone ? esc(VEG.ZONES[ctx.zone].short) : '不明'}）</span><select id="zOv"><option value="">推定値を使う</option>${Object.entries(VEG.ZONES).map(([k, v]) => `<option value="${k}"${r.zoneOverride === k ? ' selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>
          <label class="f"><span>気候区分</span><select id="sOv"><option value="">推定値（${ctx.pref ? (ctx.pref.sea === 'J' ? '日本海側' : '太平洋側') : '-'}）</option><option value="J"${r.seaOverride === 'J' ? ' selected' : ''}>日本海側（多雪）</option><option value="P"${r.seaOverride === 'P' ? ' selected' : ''}>太平洋側（少雪）</option></select></label>

      $('#idBox').innerHTML = idRes.results.map((x, i) => `<div class="cand${i === 0 ? ' top' : ''}">
        <div class="spread"><span><b>${esc(x.s.ja)}</b> <span class="badge">${esc(VEG.STAGES[x.s.stage].short)}</span>${x.flags.map(f => `<span class="flag">${esc(f)}</span>`).join('')}</span><b>${Math.round(x.score * 100)}%</b></div>
        <div class="small muted"><i>${esc(x.s.la)}</i>　${esc(x.s.cls)}</div>
        <div class="bar"><i style="width:${Math.round(x.score * 100)}%"></i></div>
        <div class="chips">${x.s.char.map(n => `<span class="chip ${x.hitChar.includes(n) ? 'hit' : 'miss'}" title="標徴種・優占種">${esc(n)}</span>`).join('')}${x.hitDiff.map(n => `<span class="chip char" title="識別種">${esc(n)}</span>`).join('')}</div>
        <p class="small" style="margin-top:6px">${esc(x.s.note)}</p></div>`).join('') +
        `<p class="small muted">組成の一致度 × 地理的整合（植生帯・地方・日本海側／太平洋側）で順位付けしています。塗りつぶしは確認済み、取り消し線は未確認の標徴種です。参照DBは代表種による簡易版のため、確定には地域の植生誌・原記載と照合してください。</p>`;
