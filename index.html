        ${pred.climaxRank.length ? `<h3>到達しうる極相（潜在自然植生）の候補</h3>${pred.climaxRank.map((c, i) => `<div class="cand"><b>${i + 1}. ${esc(c.s.ja)}</b><div class="small muted">${esc(c.why.join('／') || '植生帯・地方から')}</div></div>`).join('')}` : ''}
        <p class="small muted">年数は日本の二次遷移に関する一般的な知見にもとづく目安で、種子供給源・シカ密度・気象害などで大きく変わります。</p>`;
    }
    function drawAll() { drawCtx(); drawId(); drawSuc(); }
    drawAll();
    bindRegionBrowser();
  }

  function timelineSVG(pred, year) {
    const path = pred.path;
    const lastStart = path.length ? path[path.length - 1].start[2] : 0;
    const maxY = Math.min(400, Math.max(60, Math.ceil((lastStart * 1.15 + 10) / 10) * 10, year + 10));
    const L = 168, W = 520, R = 14, rowH = 36, top = 10, H = top + path.length * rowH + 34;
    const x = y => L + (W - L - R) * Math.min(1, y / maxY);
    const rows = path.map((p, i) => {
      const y0 = top + i * rowH;
      const next = path[i + 1];
      const e = next ? next.start[1] : maxY;
      const cur = year >= p.start[1] && year < e;
      const name = p.name.length > 11 ? p.name.slice(0, 10) + '…' : p.name;
      return `<g><text x="${L - 8}" y="${y0 + 21}" text-anchor="end" font-size="14" font-weight="${cur ? 800 : 500}"><title>${esc(p.name)}</title>${esc(name)}</text>
        <line x1="${x(p.start[0])}" x2="${x(p.start[2])}" y1="${y0 + 17}" y2="${y0 + 17}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 3"/>
        <rect x="${x(p.start[1])}" y="${y0 + 8}" width="${Math.max(3, x(e) - x(p.start[1]))}" height="18" rx="3" fill="${cur ? 'var(--tape)' : 'var(--forest)'}" opacity="${cur ? 1 : 0.75}"/></g>`;
    }).join('');
    const ticks = []; const step = maxY > 200 ? 50 : maxY > 100 ? 25 : 10;
    for (let t = 0; t <= maxY; t += step) ticks.push(`<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 26}" stroke="var(--line)"/><text x="${x(t)}" y="${H - 10}" font-size="13" text-anchor="middle" fill="var(--muted)" style="fill:var(--muted)">${t}</text>`);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="遷移の時間軸">${ticks.join('')}${rows}
      <line x1="${x(year)}" x2="${x(year)}" y1="${top - 4}" y2="${H - 24}" stroke="var(--tape)" stroke-width="2.5"/>
      <text x="${W - R}" y="${H - 10}" font-size="11" text-anchor="end" fill="var(--muted)" style="fill:var(--muted)">年</text></svg>
      <p class="small muted">帯は標準的な到達時期、点線は早い〜遅い場合の開始時期の幅。</p>`;
  }

  function regionBrowserHTML(r) {
    return `<details class="panel"><summary>地域ごとの群集一覧（調査前の下調べ）</summary>
      <div class="grid2" style="margin-top:10px">
        <label class="f"><span>都道府県</span><select id="rbPref">${opts(VEG.PREFS.map(p => p.name), (r && r.pref) || '東京都')}</select></label>
        <label class="f"><span>標高 (m)</span><input type="number" id="rbElev" value="${esc((r && r.elev) || 100)}"></label>
      </div><div id="rbOut"></div></details>`;
  }
  function bindRegionBrowser() {
    const draw = () => {
      const pref = $('#rbPref').value, elev = $('#rbElev').value;
      const z = VEG.zoneOf(pref, elev, S.settings.prefOverrides);
      const list = VEG.Analysis.candidatesFor(pref, elev, syntaxa(), S.settings);
      $('#rbOut').innerHTML = `<p class="small" style="margin-top:8px">${esc(VEG.ZONES[z].name)}</p>` + list.map(({ s, seaMatch }) => `<div class="cand"><b>${esc(s.ja)}</b> <span class="badge">${esc(VEG.STAGES[s.stage].short)}</span>${seaMatch ? '' : '<span class="flag">' + (s.sea === 'J' ? '日本海側型' : '太平洋側型') + '</span>'}
        <div class="small muted"><i>${esc(s.la)}</i></div><div class="small">標徴種・優占種：${esc(s.char.join('、'))}／識別種：${esc(s.diff.join('、') || '-')}</div></div>`).join('');
    };
    if (!$('#rbPref')) return;
    $('#rbPref').onchange = draw; $('#rbElev').oninput = draw; draw();
  }

  /* =========================================================
     植生図
     ========================================================= */
  let mapObj = null;
  const mapState = { color: 'community', drawing: false, pts: [], temp: null };
  const PALETTE = ['#2E6F9E', '#C0582B', '#4E8A3A', '#8A4FA0', '#B08A1E', '#2C8C8C', '#A33A4E', '#5A5F6B', '#6B8E23', '#D2691E', '#1E6B52', '#7A4E2D'];
  // 群落名 → 色：現在の調査区と区画に出てくる群落名を五十音順に並べ、順に色を割り当てる（同じデータなら毎回同じ色）
  let colorReg = null;
  function buildColorReg() {
    const names = new Set(S.features.map(f => f.properties.community));
    S.releves.forEach(r => { const c = topCommunity(r); if (c) names.add(c.name); });
    colorReg = new Map(Array.from(names).sort((a, b) => a.localeCompare(b, 'ja')).map((n, i) => [n, PALETTE[i % PALETTE.length]]));
  }
  function colorForName(name) {
    if (!colorReg) buildColorReg();
    if (!colorReg.has(name)) colorReg.set(name, PALETTE[colorReg.size % PALETTE.length]);
    return colorReg.get(name);
  }

  function pointLabel(r) {
    if (mapState.color === 'group' && lastTable) {
      const i = lastTable.releves.indexOf(r);
      if (i >= 0) { const g = lastTable.groups[i]; return { label: '群' + VEG.Analysis.groupLabel(g), color: getComputedStyle(document.documentElement).getPropertyValue(GROUP_COLORS[g % 8]).trim() || PALETTE[g] }; }
      return { label: '解析対象外', color: '#888' };
    }
    const c = topCommunity(r); const n = c ? c.name : '判定なし';
    return { label: n, color: c ? colorForName(n) : '#888' };
  }

  function renderMap() {
    if (mapObj) { mapObj.off(); mapObj.remove(); mapObj = null; }
    mapState.temp = null; colorReg = null;
    const pts = S.releves.filter(r => r.lat !== '' && r.lng !== '' && !isNaN(+r.lat) && !isNaN(+r.lng));
    if (mapState.color === 'group' && !lastTable && included().length >= 2) computeTable();
    view.innerHTML = `
      <h1>植生図</h1>
      <p class="lead">調査区を判定結果で色分けし、同じ群落と判断できる範囲を区画として描いて現存植生図を作ります。背景地図は国土地理院タイル（表示した範囲は端末に保存され、圏外でも再表示できます）。</p>
      <section class="panel noprint">
        <div class="row">
          <label class="f" style="min-width:220px"><span>調査区の色分け</span><select id="mColor"><option value="community"${mapState.color === 'community' ? ' selected' : ''}>判定された群集</option><option value="group"${mapState.color === 'group' ? ' selected' : ''}>植生表の群</option></select></label>
          <button class="btn sm primary" id="mDraw">${mapState.drawing ? '描画を終える' : '植生区画を描く'}</button>
          <button class="btn sm" id="mGeo">GeoJSONを書き出す</button>
          <label class="btn sm"><input type="file" id="mImp" accept=".geojson,.json" hidden>GeoJSONを読み込む</label>
        </div>
        <div id="drawBox"></div>
      </section>
      <div id="map" role="region" aria-label="地図"></div>
      <div class="legend" id="legend"></div>
      <section class="panel" style="margin-top:14px"><h2>植生区画 <span class="small muted">${S.features.length}区画</span></h2><div id="fList"></div></section>`;
    $('#mColor').onchange = e => { mapState.color = e.target.value; renderMap(); };
    $('#mGeo').onclick = exportGeoJSON;
    $('#mImp').onchange = importGeoJSON;
    $('#mDraw').onclick = () => { mapState.drawing = !mapState.drawing; mapState.pts = []; renderMap(); };
    drawFeatureList();

    if (!window.L) {
      $('#mDraw').disabled = true; $('#mDraw').title = '地図ライブラリの取得後に使えます';
      if (document.readyState !== 'complete') { window.addEventListener('load', () => { if ((location.hash || '').startsWith('#map')) renderMap(); }, { once: true }); }
      fallbackMap(pts);
      return;
    }
    const L = window.L;
    mapObj = L.map('map', { zoomControl: true, doubleClickZoom: !mapState.drawing });
    const gsi = (id, ext, name) => L.tileLayer(`https://cyberjapandata.gsi.go.jp/xyz/${id}/{z}/{x}/{y}.${ext}`, { attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>', maxZoom: 18, crossOrigin: true });
    const base = { '標準地図': gsi('std', 'png'), '淡色地図': gsi('pale', 'png'), '写真': gsi('seamlessphoto', 'jpg'),
      'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }) };
    base['淡色地図'].addTo(mapObj);
    L.control.layers(base, null, { collapsed: true }).addTo(mapObj);
    L.control.scale({ imperial: false }).addTo(mapObj);

    // 先に表示範囲を決めてから図形を追加する（Leafletの初期化順序の制約）
    const ll = pts.map(r => [+r.lat, +r.lng]);
    S.features.forEach(f => ((f.geometry && f.geometry.coordinates && f.geometry.coordinates[0]) || []).forEach(c => ll.push([c[1], c[0]])));
    if (ll.length) mapObj.fitBounds(L.latLngBounds(ll).pad(0.3), { maxZoom: 16, animate: false });
    else mapObj.setView([36.2, 138.3], 5);
    const legend = new Map();
    S.features.forEach((f, i) => {
      const col = colorForName(f.properties.community);
      legend.set(f.properties.community, col);
      L.geoJSON(f, { interactive: !mapState.drawing, style: { color: col, weight: 2, fillColor: col, fillOpacity: 0.35 } })
        .bindPopup(`<b>${esc(f.properties.community)}</b><br>${esc(f.properties.note || '')}`).addTo(mapObj);
    });
    const markers = [];
    pts.forEach(r => {
      const p = pointLabel(r); legend.set(p.label, p.color);
      const m = L.circleMarker([+r.lat, +r.lng], { radius: 9, color: '#fff', weight: 2, fillColor: p.color, fillOpacity: 1, interactive: !mapState.drawing })
        .bindPopup(`<b>${esc(r.code)}</b> ${esc(r.site || '')}<br>${esc(p.label)}<br><a href="#edit/${encodeURIComponent(r.id)}">記録を開く</a>`)
        .bindTooltip(esc(r.code), { permanent: true, direction: 'right', offset: [8, 0], className: '' });
      m.addTo(mapObj); markers.push(m);
    });
    $('#legend').innerHTML = Array.from(legend.entries()).map(([k, c]) => `<span><i style="background:${c}"></i>${esc(k)}</span>`).join('');

    if (mapState.drawing) setupDrawing(L);
  }

  function setupDrawing(L) {
    const box = $('#drawBox');
    const comms = Array.from(new Set(S.releves.map(r => (topCommunity(r) || {}).name).filter(Boolean).concat(syntaxa().map(s => s.ja))));
    box.innerHTML = `<p class="small" style="margin-top:10px">地図をタップして頂点を置き、3点以上で「区画を保存」。</p>
      <div class="grid2"><label class="f"><span>群落名</span><input type="text" id="dName" list="commList" placeholder="例：ヤブコウジ－スダジイ群集"></label>
      <label class="f"><span>メモ</span><input type="text" id="dNote" placeholder="判読根拠など"></label></div>
      <datalist id="commList">${comms.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <div class="row" style="margin-top:8px"><button class="btn sm tape" id="dSave">区画を保存</button><button class="btn sm" id="dUndo">1点戻す</button><span class="small muted" id="dCount">0点</span></div>`;
    const redraw = () => {
      if (mapState.temp) mapState.temp.remove();
      mapState.temp = L.polygon(mapState.pts, { color: '#D92E63', weight: 2, dashArray: '5 4', fillOpacity: 0.15, interactive: false }).addTo(mapObj);
      $('#dCount').textContent = mapState.pts.length + '点';
    };
    mapObj.on('click', e => { mapState.pts.push([e.latlng.lat, e.latlng.lng]); redraw(); });
    $('#dUndo').onclick = () => { mapState.pts.pop(); redraw(); };
    $('#dSave').onclick = () => {
      const name = $('#dName').value.trim();
      if (mapState.pts.length < 3) { toast('3点以上を置いてください'); return; }
      if (!name) { toast('群落名を入れてください'); $('#dName').focus(); return; }
      const ring = mapState.pts.map(p => [+p[1].toFixed(6), +p[0].toFixed(6)]); ring.push(ring[0]);
      S.features.push({ type: 'Feature', properties: { community: name, note: $('#dNote').value.trim(), color: colorForName(name), created: today() }, geometry: { type: 'Polygon', coordinates: [ring] } });
      save(true); mapState.pts = []; toast('区画を保存しました'); renderMap();
    };
  }
  function drawFeatureList() {
    $('#fList').innerHTML = S.features.length ? `<table class="plain"><thead><tr><th>群落</th><th>面積（概算）</th><th></th></tr></thead><tbody>${S.features.map((f, i) =>
      `<tr><td><i style="display:inline-block;width:12px;height:12px;border-radius:2px;background:${colorForName(f.properties.community)}"></i> ${esc(f.properties.community)}</td><td>${polyArea(f).toFixed(2)} ha</td><td><button class="btn sm danger" data-fdel="${i}">削除</button></td></tr>`).join('')}</tbody></table>`
      : '<p class="muted small">まだ区画はありません。「植生区画を描く」で、同じ群落が広がる範囲を地図上に描けます。</p>';
    $('#fList').onclick = e => { const b = e.target.closest('[data-fdel]'); if (!b) return; if (!confirm('この区画を削除しますか？')) return; S.features.splice(+b.dataset.fdel, 1); save(true); renderMap(); };
  }
  function polyArea(f) {
    const ring = f.geometry && f.geometry.coordinates && f.geometry.coordinates[0]; if (!ring) return 0;
    const R = 6378137, rad = Math.PI / 180; let s = 0;
    for (let i = 0; i < ring.length - 1; i++) { const [x1, y1] = ring[i], [x2, y2] = ring[i + 1]; s += (x2 - x1) * rad * (2 + Math.sin(y1 * rad) + Math.sin(y2 * rad)); }
    return Math.abs(s * R * R / 2) / 10000;
  }
  function fallbackMap(pts) {
    const el = $('#map');
    if (!pts.length) { el.innerHTML = '<div class="empty">地図ライブラリを読み込めていません（初回はオンラインで開く必要があります）。緯度・経度のある調査区もまだありません。</div>'; return; }
    const lats = pts.map(r => +r.lat), lngs = pts.map(r => +r.lng);
    const [a, b, c, d] = [Math.min(...lats), Math.max(...lats), Math.min(...lngs), Math.max(...lngs)];
    const pad = 0.1, W = 600, H = 420;
    const sx = v => 30 + (W - 60) * ((v - c) / ((d - c) || 1e-4));
    const sy = v => H - 30 - (H - 60) * ((v - a) / ((b - a) || 1e-4));
    const leg = new Map();
    const dots = pts.map(r => { const p = pointLabel(r); leg.set(p.label, p.color); return `<circle cx="${sx(+r.lng)}" cy="${sy(+r.lat)}" r="8" fill="${p.color}" stroke="#fff" stroke-width="2"/><text x="${sx(+r.lng) + 11}" y="${sy(+r.lat) + 4}" font-size="12" style="fill:var(--ink)">${esc(r.code)}</text>`; }).join('');
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%">${dots}</svg>`;
    $('#legend').innerHTML = '<span class="muted">背景地図なし（地図ライブラリ未取得）。位置関係のみ表示しています。</span>' + Array.from(leg.entries()).map(([k, c]) => `<span><i style="background:${c}"></i>${esc(k)}</span>`).join('');
    void pad;
  }
  function exportGeoJSON() {
    const feats = S.releves.filter(r => r.lat !== '' && r.lng !== '').map(r => {
      const c = topCommunity(r);
      const gi = lastTable ? lastTable.releves.indexOf(r) : -1;
      return { type: 'Feature', geometry: { type: 'Point', coordinates: [+r.lng, +r.lat] },
        properties: { kind: 'releve', code: r.code, site: r.site, date: r.date, pref: r.pref, elev: r.elev, area_m2: r.area, community: c ? c.name : '', score: c ? +c.score.toFixed(3) : null, group: gi >= 0 ? VEG.Analysis.groupLabel(lastTable.groups[gi]) : '', n_species: new Set((r.records || []).map(x => x.sp)).size } };
    });
    const polys = S.features.map(f => Object.assign({}, f, { properties: Object.assign({ kind: 'vegetation_unit' }, f.properties) }));
    download(`vegetation_map_${today()}.geojson`, JSON.stringify({ type: 'FeatureCollection', features: feats.concat(polys) }, null, 1), 'application/geo+json');
  }
  function importGeoJSON(e) {
    const file = e.target.files[0]; if (!file) return;
    file.text().then(t => {
      const j = JSON.parse(t); let n = 0;
      (j.features || []).forEach(f => { if (f.geometry && f.geometry.type === 'Polygon') { f.properties = f.properties || {}; f.properties.community = f.properties.community || f.properties.name || '名称なし'; S.features.push(f); n++; } });
      save(true); toast(`${n}区画を読み込みました`); renderMap();
    }).catch(() => toast('GeoJSONを読み込めませんでした。ファイル形式を確認してください。'));
  }

      <section class="panel"><h2>データの保存と移行</h2>

          <button class="btn sm primary" id="bkOut">バックアップを書き出す（JSON）</button>
          <label class="btn sm"><input type="file" id="bkIn" accept=".json" hidden>バックアップから復元</label>

    $('#sScale').onchange = e => { st.scale = e.target.value; save(); toast('被度の階級を変更しました'); };
    $('#sObs').oninput = e => { st.observer = e.target.value; save(); };

    const zEdit = () => {

      const v = k => o[k] != null ? o[k] : p[k];

        <tr><td>森林限界</td><td><input type="number" data-zk="sa" value="${v('sa')}"> m</td></tr>
        <tr><td>気候区分</td><td><select data-zk="sea">${[['J', '日本海側'], ['P', '太平洋側']].map(([k, n]) => `<option value="${k}"${v('sea') === k ? ' selected' : ''}>${n}</option>`).join('')}</select></td></tr></tbody></table>
        <button class="btn sm" id="zReset" style="margin-top:8px">${esc(name)}を既定値に戻す</button>`;
      $('#zEdit').onchange = e => { const k = e.target.dataset.zk; if (!k) return; st.prefOverrides[name] = Object.assign({}, st.prefOverrides[name], { [k]: k === 'sea' ? e.target.value : +e.target.value }); save(); toast('境界を更新しました'); };

    $('#dbOut').onclick = () => download('syntaxa_db.json', JSON.stringify({ format: 'vegsurvey-syntaxa-1', syntaxa: syntaxa() }, null, 1), 'application/json');
    $('#dbIn').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      file.text().then(t => {
        const j = JSON.parse(t); const arr = Array.isArray(j) ? j : j.syntaxa;
        if (!Array.isArray(arr)) throw new Error('syntaxa配列がありません');
        const ok = arr.filter(s => s && s.ja && Array.isArray(s.char)).map(s => Object.assign({ id: 'c-' + s.ja, la: '', cls: '', type: 'climax', stage: 7, zones: ['WE'], regions: [], sea: '', diff: [], comp: [], note: '' }, s));
        const ids = new Set(ok.map(s => s.id));
        st.customSyntaxa = st.customSyntaxa.filter(s => !ids.has(s.id)).concat(ok.filter(s => !VEG.SYNTAXA.some(b => b.id === s.id && JSON.stringify(b) === JSON.stringify(s))));
        save(true); refreshSpeciesList(); toast(`${ok.length}群集を読み込みました`); renderSettings();
      }).catch(err => toast('読み込めませんでした：' + err.message));
    };
    $('#dbRep').onchange = e => { st.replaceDB = e.target.checked; save(); toast(st.replaceDB ? '追加分のDBだけを使います' : '内蔵DBと追加分を併用します'); };
    $('#dbClr').onclick = () => { if (confirm('追加した群集データを消去しますか？')) { st.customSyntaxa = []; st.replaceDB = false; save(true); renderSettings(); } };
    $('#bkOut').onclick = () => download(`vegsurvey_backup_${today()}.json`, JSON.stringify({ format: 'vegsurvey-backup-1', version: VERSION, exported: new Date().toISOString(), data: S }, null, 1), 'application/json');
    $('#bkIn').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      file.text().then(t => {
        const j = JSON.parse(t); const d = j.data || j;
        if (!Array.isArray(d.releves)) throw new Error('調査区データがありません');
        const replace = confirm('現在のデータを置き換えますか？\n［OK］置き換える　［キャンセル］追加する');
        if (replace) { S = Object.assign(defaults(), d); S.settings = Object.assign(defaults().settings, d.settings || {}); }
        else {
          const ids = new Set(S.releves.map(r => r.id));
          d.releves.forEach(r => { if (ids.has(r.id)) r.id = r.id + '-' + Date.now().toString(36); S.releves.push(r); });
          S.features = S.features.concat(d.features || []);
        }
        save(true); applyTheme(); refreshSpeciesList(); toast(`${d.releves.length}地点を読み込みました`); renderSettings();
      }).catch(err => toast('復元できませんでした：' + err.message));
    };
    $('#csvOut').onclick = () => {
      const head = ['調査区', '調査日', '調査者', '都道府県', '地点名', '緯度', '経度', '標高', '傾斜', '方位', '微地形', '土壌', '湿り', '人為的影響', '経過年数', '面積m2', '階層', '種名', '被度', '群度'];
      const rows = [head];
      S.releves.forEach(r => (r.records || []).forEach(x => rows.push([r.code, r.date, r.observer, r.pref, r.site, r.lat, r.lng, r.elev, r.slope, r.aspect, r.topo, r.soil, r.moist, r.impact, r.yearsSince, r.area, layerName(x.layer), x.sp, x.cover, x.soc])));
      download(`releves_long_${today()}.csv`, toCSV(rows), 'text/csv');
    };
    $('#wipe').onclick = () => {
      if (!confirm('すべての調査区・植生区画・設定を消去します。先にバックアップを書き出しましたか？')) return;
      S = defaults(); save(true); applyTheme(); toast('消去しました'); location.hash = '#list';
    };
  }

  /* ---------------- 起動 ---------------- */
  applyTheme(); updateNet(); refreshSpeciesList(); route();
  window.VEG_APP = { state: () => S, version: VERSION };
})();

</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
