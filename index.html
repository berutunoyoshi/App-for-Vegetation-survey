        <div class="sprow-input" style="margin:8px 0">
          <input type="text" id="spIn" list="splist" placeholder="種名（カタカナ）" autocomplete="off" enterkeyhint="done">
          <button class="btn tape" id="btnAdd">追加</button>
        </div>
        <div class="entry-scales">
          <div class="lbl">被度</div><div class="seg" id="segCover">${scale().classes.map(c => `<button type="button" data-v="${c.v}" title="${esc(c.desc)}" aria-pressed="${entry.cover === c.v}">${c.label}</button>`).join('')}</div>
          <div class="lbl">群度</div><div class="seg" id="segSoc">${VEG.SOCIABILITY.map(s => `<button type="button" data-v="${s.v}" title="${esc(s.desc)}" aria-pressed="${entry.soc === s.v}">${s.v}</button>`).join('')}</div>
        </div>
        <div class="chips recent" id="recent"></div>
      </section>`;

    const touch = () => { r.updatedAt = Date.now(); save(); saveState(); };
    function saveState() {
      const dirty = !r.savedAt || r.updatedAt > r.savedAt;
      const t = x => new Date(x).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      $('#saveState').textContent = !r.savedAt ? '下書き（未保存）' : dirty ? '保存後に変更あり' : '保存済み';
      $('#saveState').className = dirty ? 'st-draft' : 'st-saved';
      $('#saveSub').textContent = (r.savedAt ? '最終保存 ' + t(r.savedAt) + '。' : '') + '入力中の内容も下書きとして端末に自動で残ります。';
    }
    $('#btnSave').onclick = () => {
      if (!r.code.trim()) { toast('調査区番号を入れてください'); $('[data-f=code]').focus(); return; }
      if (P().releves.some(x => x !== r && x.code === r.code)) { toast(`調査区番号 ${r.code} は既に使われています`); $('[data-f=code]').focus(); return; }
      const miss = [];
      if (!r.date) miss.push('調査日'); if (!r.pref) miss.push('都道府県'); if (!r.area) miss.push('面積'); if (!r.records.length) miss.push('出現種');
      if (miss.length && !confirm(`次の項目が未入力です：${miss.join('、')}\nこのまま保存しますか？`)) return;
      r.savedAt = Date.now(); r.updatedAt = r.savedAt; save(true); saveState();
      toast(`調査区 ${r.code} を保存しました`);
    };
    $('#btnSaveX').onclick = () => exportReleveExcel(r);
    view.addEventListener('input', onInput);
    view.addEventListener('change', onInput);
    function onInput(e) {
      const t = e.target;
      if (t.dataset.f) {
        r[t.dataset.f] = t.value; touch();
        if (t.dataset.f === 'size') {
          const m = /^\s*([\d.]+)\s*[x×*]\s*([\d.]+)\s*$/i.exec(t.value);
          if (m) { r.area = +(m[1] * m[2]).toFixed(2); $('[data-f=area]').value = r.area; }
        }
        if (['pref', 'elev'].includes(t.dataset.f)) { zoneInfo(); cand(); idPreview(); }
        if (['plotType', 'area', 'size'].includes(t.dataset.f)) areaMsg();
        if (t.dataset.f === 'code') $('h1').textContent = '調査区 ' + t.value;
      } else if (t.dataset.lay) {
        r.layers[t.dataset.lay][t.dataset.k] = t.value; touch();
      } else if (t.dataset.idx != null && t.dataset.k) {
        r.records[+t.dataset.idx][t.dataset.k] = t.value; touch(); spList(); idPreview();
      }
    }
    // 画面遷移時にリスナーを外す
    const off = () => { view.removeEventListener('input', onInput); view.removeEventListener('change', onInput); window.removeEventListener('hashchange', off); };
    window.addEventListener('hashchange', off);

    function zoneInfo() {
      const ctx = VEG.Analysis.contextOf(r, cfg());
      $('#zoneInfo').textContent = ctx.zone ? `推定植生帯：${VEG.ZONES[ctx.zone].name}（${ctx.region}、${ctx.sea === 'J' ? '日本海側' : '太平洋側'}型の目安）` : '都道府県と標高を入れると植生帯を推定します。';
    }
    function areaMsg() {
      const g = VEG.PLOT_GUIDE.find(p => p.type === r.plotType); const a = Number(r.area);
      const el = $('#areaMsg');
      if (!g) { el.textContent = ''; return; }
      if (!a) { el.innerHTML = `<span class="muted">${esc(g.name)}の目安：${g.min}〜${g.max} m²（${esc(g.note)}）</span>`; return; }
      el.innerHTML = a < g.min ? `<span class="note" style="display:block">面積が${esc(g.name)}の目安（${g.min}〜${g.max} m²）より小さく、種数を過小評価する恐れがあります。</span>`
        : a > g.max ? `<span class="note" style="display:block">面積が目安（${g.min}〜${g.max} m²）より大きく、異質な植生を含む恐れがあります。</span>`
          : `<span class="muted">目安（${g.min}〜${g.max} m²）の範囲内です。</span>`;
    }
    function spList() {
      const recs = r.records.map((x, i) => Object.assign({ i }, x));
      $('#spCount').textContent = `${new Set(r.records.map(x => x.sp)).size}種、${r.records.length}記録`;
      const cls = scale().classes.map(c => c.v);
      $('#spList').innerHTML = LAYER_IDS.map(L => {
        const rows = recs.filter(x => x.layer === L).sort((a, b) => VEG.coverMid(b.cover) - VEG.coverMid(a.cover));
        const dom = rows[0] ? rows[0].sp : '';
        const td = $(`[data-dom="${L}"]`); if (td) td.textContent = dom;
        if (!rows.length) return '';
        return `<div class="splayer" data-l="${L}"><h3>${esc(layerName(L))} <span class="small muted">${rows.length}種</span></h3>
          ${rows.map(x => `<div class="sprow"><span>${esc(x.sp)}</span>
            <select data-idx="${x.i}" data-k="cover" aria-label="${esc(x.sp)}の被度">${opts(cls.includes(x.cover) ? cls : cls.concat([x.cover]), x.cover)}</select>
            <select data-idx="${x.i}" data-k="soc" aria-label="${esc(x.sp)}の群度">${opts(['1', '2', '3', '4', '5'], x.soc)}</select>
            <button class="x" data-del="${x.i}" aria-label="${esc(x.sp)}を削除">×</button></div>`).join('')}</div>`;
      }).join('') || '<p class="muted">下の入力欄で階層を選び、種名・被度・群度を入れて「追加」します。</p>';
    }
    function cand() {
      const box = $('#cand');
      if (!r.pref) { box.innerHTML = '<p class="muted small">都道府県を選ぶと、植生帯と地方に合う群集の候補を表示します。種名をタップすると入力欄に入ります。</p>'; return; }
      const list = VEG.Analysis.candidatesFor(r.pref, r.elev, syntaxa(), cfg());
      box.innerHTML = list.map(({ s, seaMatch }) => `<div class="cand"><b>${esc(s.ja)}</b> <span class="badge">${esc(VEG.STAGES[s.stage].short)}</span>${seaMatch ? '' : '<span class="flag">' + (s.sea === 'J' ? '日本海側型' : '太平洋側型') + '</span>'}
        <div class="chips" style="margin-top:6px">${s.char.map(n => `<button class="chip char" data-sp="${esc(n)}">${esc(n)}</button>`).join('')}${s.diff.map(n => `<button class="chip" data-sp="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>`).join('') || '<p class="muted">該当する群集が参照DBにありません。</p>';
    }
    function idPreview() {
      const res = VEG.Analysis.identify(r, syntaxa(), cfg());
      const box = $('#idPreview');
      if (!res.results.length) { box.innerHTML = '<p class="muted small">種を記録すると、参照DBとの照合結果がここに出ます。</p>'; return; }
      box.innerHTML = res.results.slice(0, 3).map((x, i) => `<div class="cand${i === 0 ? ' top' : ''}"><div class="spread"><b>${esc(x.s.ja)}</b><span>${Math.round(x.score * 100)}%</span></div>
        <div class="bar"><i style="width:${Math.round(x.score * 100)}%"></i></div>
        <div class="small muted">一致：${esc(x.hitChar.concat(x.hitDiff).join('、'))}${x.miss.length ? '／未確認：' + esc(x.miss.join('、')) : ''}</div></div>`).join('') +
        `<p class="small muted" style="margin-top:6px">未確認の標徴種が調査区外に生えていないか確認すると、判定の精度が上がります。</p>`;
    }
    function recent() {
      $('#recent').innerHTML = (S.recent || []).slice(0, 14).map(n => `<button class="chip" data-sp="${esc(n)}">${esc(n)}</button>`).join('');
    }
    function add() {
      const sp = $('#spIn').value.trim().replace(/\s+/g, '');
      if (!sp) { toast('種名を入力してください'); $('#spIn').focus(); return; }
      const ex = r.records.find(x => x.sp === sp && x.layer === entry.layer);
      if (ex) { ex.cover = entry.cover; ex.soc = entry.soc; toast(`${sp}（${layerName(entry.layer)}）を更新しました`); }
      else { r.records.push({ sp, layer: entry.layer, cover: entry.cover, soc: entry.soc }); toast(`${sp}（${layerName(entry.layer)} ${entry.cover}・${entry.soc}）を追加しました`); }
      S.recent = [sp].concat((S.recent || []).filter(n => n !== sp)).slice(0, 30);
      touch(); spList(); idPreview(); recent();
      $('#spIn').value = ''; entry.cover = '+'; entry.soc = '1';
      $$('#segCover button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === entry.cover));
      $$('#segSoc button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === entry.soc));
      $('#spIn').focus();
    }
    const segBind = (sel, key, attr) => { $(sel).onclick = e => { const b = e.target.closest('button'); if (!b) return; entry[key] = b.dataset[attr]; $$(sel + ' button').forEach(x => x.setAttribute('aria-pressed', x === b)); }; };
    segBind('#segLayer', 'layer', 'l'); segBind('#segCover', 'cover', 'v'); segBind('#segSoc', 'soc', 'v');
    $('#btnAdd').onclick = add;
    $('#spIn').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
    view.onclick = e => {
      const chip = e.target.closest('[data-sp]');
      if (chip) { $('#spIn').value = chip.dataset.sp; $('#spIn').focus(); return; }
      const del = e.target.closest('[data-del]');
      if (del) {
        const i = +del.dataset.del; const x = r.records[i];
        if (!confirm(`${x.sp}（${layerName(x.layer)} ${x.cover}・${x.soc}）を出現種から削除しますか？`)) return;
        r.records.splice(i, 1); touch(); spList(); idPreview(); toast(`${x.sp}を削除しました`);
      }
    };
    $('#btnDel').onclick = () => { if (confirmDeleteReleve(r)) { save(true); location.hash = '#list'; } };
    $('#btnGPS').onclick = () => {
      if (!navigator.geolocation) { $('#gpsMsg').textContent = 'この端末は位置情報に対応していません。'; return; }
      $('#gpsMsg').textContent = '測位中…';
      navigator.geolocation.getCurrentPosition(p => {
        r.lat = +p.coords.latitude.toFixed(6); r.lng = +p.coords.longitude.toFixed(6);
        $('[data-f=lat]').value = r.lat; $('[data-f=lng]').value = r.lng;
        if (p.coords.altitude != null && r.elev === '') { r.elev = Math.round(p.coords.altitude); $('[data-f=elev]').value = r.elev; }
        $('#gpsMsg').textContent = `誤差 約${Math.round(p.coords.accuracy)}m` + (p.coords.altitude != null ? '（GPS標高は誤差が大きいため要確認）' : '');
        touch(); zoneInfo();
      }, err => { $('#gpsMsg').textContent = '取得できませんでした：' + err.message; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    };
    $('#btnElev').onclick = async () => {
      if (!r.lat || !r.lng) { toast('先に緯度・経度を入れてください'); return; }
      if (!navigator.onLine) { toast('オフラインのため取得できません。標高は地形図などで確認してください。'); return; }
      $('#gpsMsg').textContent = '取得中…';
      try {
        const e1 = await fetch(`https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${r.lng}&lat=${r.lat}&outtype=JSON`).then(x => x.json());
        if (typeof e1.elevation === 'number') { r.elev = Math.round(e1.elevation); $('[data-f=elev]').value = r.elev; }
        const g = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${r.lat}&lon=${r.lng}`).then(x => x.json());
        const cd = g && g.results && g.results.muniCd ? String(g.results.muniCd).padStart(5, '0') : '';
        if (cd) { const p = VEG.PREFS[parseInt(cd.slice(0, 2), 10) - 1]; if (p) { r.pref = p.name; $('[data-f=pref]').value = p.name; } }
        $('#gpsMsg').textContent = '国土地理院のデータから取得しました';
        touch(); zoneInfo(); cand(); idPreview();
      } catch (err) { $('#gpsMsg').textContent = '取得に失敗しました。通信状況を確認してください。'; }
    };
    zoneInfo(); areaMsg(); spList(); cand(); idPreview(); recent(); saveState();
  }

  /* =========================================================
     植生表
     ========================================================= */
  let lastTable = null;
  function computeTable() {
    const rs = included();
    const t = S.settings.table;
    if (rs.length < 1) return null;
    const res = VEG.Analysis.sortedTable(rs, { mergeLayers: t.merge, method: t.method, k: Math.max(1, Math.min(t.k, rs.length)), manualGroups: t.manual, minFreq: +t.minFreq, minPhi: +t.minPhi });
    res.releves = rs;
    lastTable = res;
    return res;
  }
  function renderTable() {
    const rs = included();
    if (rs.length < 2) {
      view.innerHTML = `<h1>植生表</h1><div class="empty panel"><p>植生表を作るには、解析に含める調査区が2地点以上必要です（現在 ${rs.length}地点）。</p><a class="btn primary" href="#list">調査区へ</a></div>`;
      return;
    }
    const t = S.settings.table;
    view.innerHTML = `
      <h1>植生表</h1>
      <p class="lead">素表から、調査区を類似度で群に分け、群ごとの識別種をまとめた区分表を作ります。群数や閾値を変えて、まとまりの良い区分を探してください。</p>
      <section class="panel noprint">
        <div class="grid2">
          <label class="f"><span>表の種類</span><select id="tTab">${opts(['raw', 'sorted', 'synoptic', 'dendro'], t.tab).replace(/>raw</, '>素表（出現種リスト）<').replace(/>sorted</, '>区分表（並べ替え済み）<').replace(/>synoptic</, '>常在度表<').replace(/>dendro</, '>樹形図（類似度）<')}</select></label>
          <label class="f"><span>群の数</span><input type="number" id="tK" min="1" max="${rs.length}" value="${t.k}" ${t.manual ? 'disabled' : ''}></label>
        </div>
        <details style="margin-top:10px"><summary class="small" style="cursor:pointer;font-weight:700">区分の条件と書き出し</summary>
          <div class="grid2" style="margin-top:8px">
            <label class="f"><span>類似度</span><select id="tMethod"><option value="bray"${t.method === 'bray' ? ' selected' : ''}>Bray-Curtis（被度を考慮）</option><option value="jaccard"${t.method === 'jaccard' ? ' selected' : ''}>Jaccard（在・不在）</option></select></label>
            <label class="f"><span>識別種の出現頻度（群内）</span><input type="number" id="tMinFreq" step="0.05" min="0.2" max="1" value="${t.minFreq}"></label>
            <label class="f"><span>識別種のφ係数</span><input type="number" id="tMinPhi" step="0.05" min="0" max="1" value="${t.minPhi}"></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label class="btn sm ghost"><input type="checkbox" id="tMerge" ${t.merge ? 'checked' : ''}> 階層を統合して種単位で集計</label>
            <label class="btn sm ghost"><input type="checkbox" id="tManual" ${t.manual ? 'checked' : ''}> 群を手動で指定</label>
            <button class="btn sm" id="tCSV">表をCSVで書き出す</button>
            <button class="btn sm" onclick="window.print()">印刷</button>
          </div>
        </details>
        <div id="manualBox"></div>
      </section>
      <div id="tOut"></div>`;
    const redraw = () => {
      const res = computeTable();
      drawManual(res);
      const out = $('#tOut');
      if (t.tab === 'raw') out.innerHTML = rawTableHTML(res);
      else if (t.tab === 'synoptic') out.innerHTML = synopticHTML(res);
      else if (t.tab === 'dendro') out.innerHTML = dendroHTML(res);
      else out.innerHTML = sortedTableHTML(res);
    };
    const bind = (id, key, conv) => { $(id).onchange = e => { t[key] = conv(e.target); save(); if (key === 'manual') { $('#tK').disabled = t.manual; } redraw(); }; };
    bind('#tTab', 'tab', el => el.value); bind('#tK', 'k', el => Math.max(1, Math.min(rs.length, parseInt(el.value, 10) || 1)));
    bind('#tMethod', 'method', el => el.value); bind('#tMinFreq', 'minFreq', el => +el.value); bind('#tMinPhi', 'minPhi', el => +el.value);
    bind('#tMerge', 'merge', el => el.checked); bind('#tManual', 'manual', el => el.checked);
    $('#tCSV').onclick = () => { const res = lastTable; download(`vegetation_table_${t.tab}_${today()}.csv`, toCSV(tableRows(res, t.tab)), 'text/csv'); };
    function drawManual(res) {
      const box = $('#manualBox');
      if (!t.manual) { box.innerHTML = ''; return; }
      box.innerHTML = `<p class="small muted" style="margin-top:10px">各調査区の群名（A, B…など任意の文字）を入れてください。未入力があると自動区分に戻ります。</p>
        <div class="row">${rs.map(r => `<label class="f" style="width:96px"><span>${esc(r.code)}</span><input type="text" data-g="${esc(r.id)}" value="${esc(r.group || '')}" maxlength="6"></label>`).join('')}</div>`;
      box.onchange = e => { const r = findR(e.target.dataset.g); if (r) { r.group = e.target.value.trim(); save(); redraw(); } };
    }
    redraw();
  }

  const cellText = v => v ? `${v.cover}${v.soc ? '・' + v.soc : ''}` : '';
  function spLabelHTML(k, merge) { const { sp, layer } = VEG.Analysis.labelOf(k); return `${esc(sp)}${!merge && layer ? `<span class="ly">${esc(layerName(layer))}</span>` : ''}`; }

  function headerRows(res, order, withGroups) {
    const rs = res.releves;
    const gs = res.groups;
    const gstart = j => withGroups && j > 0 && gs[order[j]] !== gs[order[j - 1]];
    const nsp = r => new Set((r.records || []).map(x => x.sp)).size;
    return `<thead>
      ${withGroups ? `<tr><th class="sp">群</th>${order.map((i, j) => `<th class="${gstart(j) ? 'gstart' : ''}">${j === 0 || gstart(j) ? `<span class="gl" style="--gc:${gColor(gs[i])}">${VEG.Analysis.groupLabel(gs[i])}</span>` : ''}</th>`).join('')}</tr>` : ''}
      <tr><th class="sp">調査区番号</th>${order.map((i, j) => `<th class="${gstart(j) ? 'gstart' : ''}">${esc(rs[i].code)}</th>`).join('')}</tr>
      <tr><th class="sp">面積 m² ／ 種数</th>${order.map((i, j) => `<th class="${gstart(j) ? 'gstart' : ''}" style="font-weight:400">${esc(rs[i].area || '-')}／${nsp(rs[i])}</th>`).join('')}</tr>
    </thead>`;
  }
  function rawTableHTML(res) {
    const order = res.releves.map((_, i) => i);
    const LO = { T1: 0, T2: 1, S: 2, H: 3, M: 4 };
    const keys = res.mat.keys.slice().sort((a, b) => {
      const la = VEG.Analysis.labelOf(a).layer, lb = VEG.Analysis.labelOf(b).layer;
      return (LO[la] || 0) - (LO[lb] || 0) || res.diff.info.get(b).total - res.diff.info.get(a).total || a.localeCompare(b, 'ja');
    });
    return `<p class="small muted">入力順に並べた素表です。値は「被度・群度」。</p><div class="tablewrap"><table class="veg">${headerRows(res, order, false)}<tbody>
      ${keys.map(k => `<tr><th class="sp">${spLabelHTML(k, S.settings.table.merge)}</th>${order.map(i => { const v = res.mat.rows.get(k)[i]; return `<td class="${v ? 'on' : ''}">${cellText(v)}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  }
  function sortedTableHTML(res) {
    const order = res.order, gs = res.groups;
    const gstart = j => j > 0 && gs[order[j]] !== gs[order[j - 1]];
    const merge = S.settings.table.merge;
    const nDiff = res.blocks.filter(b => b.kind === 'diff').reduce((a, b) => a + b.keys.length, 0);
    const body = res.blocks.filter(b => b.keys.length).map(b => `
      <tr class="block"><th class="sp" colspan="1">${esc(b.title)}（${b.keys.length}）</th>${order.map((_, j) => `<td class="${gstart(j) ? 'gstart' : ''}"></td>`).join('')}</tr>
      ${b.keys.map(k => `<tr><th class="sp">${spLabelHTML(k, merge)}</th>${order.map((i, j) => {
        const v = res.mat.rows.get(k)[i];
        const inBlk = b.kind === 'diff' && b.groups.includes(gs[i]);
        return `<td class="${v ? 'on' : ''}${inBlk ? ' blk' : ''}${gstart(j) ? ' gstart' : ''}" ${inBlk ? `style="--gc:${gColor(gs[i])}"` : ''}>${cellText(v)}</td>`;
      }).join('')}</tr>`).join('')}`).join('');
    const sizes = res.diff.sizes.map((n, g) => `群${VEG.Analysis.groupLabel(g)}：${n}地点`).join('、');
    return `<p class="small muted">${sizes}。識別種 ${nDiff}種。網掛けは識別種のまとまり（同居パターン）です。${nDiff === 0 ? '識別種が抽出されない場合は群の数を減らすか、閾値を下げてください。' : ''}</p>
      <div class="tablewrap"><table class="veg">${headerRows(res, order, true)}<tbody>${body}</tbody></table></div>
      ${groupIdHTML(res)}`;
  }
  /* 群ごとの合成調査区（出現頻度40%以上の種）で群集を判定 */
  function groupSynthetic(res, g) {
    const idx = res.releves.map((_, i) => i).filter(i => res.groups[i] === g);
    const base = res.releves[idx[0]];
    const recs = [];
    res.mat.keys.forEach(k => {
      const vals = idx.map(i => res.mat.rows.get(k)[i]).filter(Boolean);
      if (vals.length / idx.length >= 0.4) {
        vals.sort((a, b) => a.mid - b.mid);
        const med = vals[Math.floor(vals.length / 2)];
        const { sp, layer } = VEG.Analysis.labelOf(k);
        recs.push({ sp, layer: layer || 'H', cover: med.cover, soc: med.soc });
      }
    });
    return Object.assign({}, base, { records: recs });
  }
  function groupIdHTML(res) {
    if (!res.diff.G) return '';
    const rows = [];
    for (let g = 0; g < res.diff.G; g++) {
      const syn = groupSynthetic(res, g);
      const id = VEG.Analysis.identify(syn, syntaxa(), cfg());
      const t = id.results[0];
      const codes = res.releves.filter((_, i) => res.groups[i] === g).map(r => r.code).join(', ');
      rows.push(`<div class="cand"><div class="spread"><span><span class="gl" style="--gc:${gColor(g)};color:#fff;background:var(--gc);border-radius:4px;padding:0 6px;font-weight:800">${VEG.Analysis.groupLabel(g)}</span> ${t ? '<b>' + esc(t.s.ja) + '</b> <span class="small muted">' + esc(t.s.la) + '</span>' : '<span class="muted">該当なし</span>'}</span>${t ? `<span>${Math.round(t.score * 100)}%</span>` : ''}</div>
        <div class="small muted">${esc(codes)}${t && t.flags.length ? '／' + esc(t.flags.join('、')) : ''}</div></div>`);
    }
    return `<section class="panel" style="margin-top:14px"><h2>群ごとの群集判定</h2>${rows.join('')}<p class="small muted">群内で出現頻度40%以上の種を合成して参照DBと照合しています。</p></section>`;
  }
  function synopticHTML(res) {
    const syn = VEG.Analysis.synoptic(res);
    const G = res.diff.G, merge = S.settings.table.merge;
    let lastBlock = null;
    const body = syn.map(row => {
      let head = '';
      if (row.block !== lastBlock) { lastBlock = row.block; head = `<tr class="block"><th class="sp">${esc(row.block.title)}</th>${Array(G).fill('<td></td>').join('')}</tr>`; }
      return head + `<tr><th class="sp">${spLabelHTML(row.key, merge)}</th>${row.cells.map((c, g) => {
        const inBlk = row.block.kind === 'diff' && row.block.groups.includes(g);
        return `<td class="${c.cls ? 'on' : ''}${inBlk ? ' blk' : ''}" ${inBlk ? `style="--gc:${gColor(g)}"` : ''}>${c.cls}${c.range ? '<sup>' + esc(c.range) + '</sup>' : ''}</td>`;
      }).join('')}</tr>`;
    }).join('');
    return `<p class="small muted">常在度：I ≤20%、II ≤40%、III ≤60%、IV ≤80%、V &gt;80%。右肩は被度の範囲。</p>
      <div class="tablewrap"><table class="veg"><thead><tr><th class="sp">群</th>${res.diff.sizes.map((n, g) => `<th><span class="gl" style="--gc:${gColor(g)}">${VEG.Analysis.groupLabel(g)}</span></th>`).join('')}</tr>
      <tr><th class="sp">調査区数</th>${res.diff.sizes.map(n => `<th>${n}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
  function dendroHTML(res) {
    if (!res.tree) return '<p class="note">群を手動指定しているため樹形図はありません。</p>';
    const order = []; (function w(n) { if (!n.left) order.push(n.id); else { w(n.left); w(n.right); } })(res.tree);
    const rowH = 26, left = 90, W = 560, H = order.length * rowH + 30;
    const maxH = res.tree.height || 1;
    const xOf = h => left + (W - left - 20) * (h / maxH);
    const yLeaf = {}; order.forEach((id, i) => { yLeaf[id] = 15 + i * rowH + rowH / 2; });
    const lines = [];
    (function draw(n) {
      if (!n.left) return { x: xOf(0), y: yLeaf[n.id] };
      const a = draw(n.left), b = draw(n.right), x = xOf(n.height);
      lines.push(`<path d="M${a.x},${a.y}H${x}V${b.y}H${b.x}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`);
      return { x, y: (a.y + b.y) / 2 };
    })(res.tree);
    const labels = order.map(id => `<text x="${left - 8}" y="${yLeaf[id] + 4}" text-anchor="end" font-size="13" font-weight="700" fill="${gColor(res.groups[id])}" style="fill:${gColor(res.groups[id])}">${esc(res.releves[id].code)}</text>`).join('');
    const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => `<text x="${xOf(maxH * f)}" y="${H - 4}" font-size="11" text-anchor="middle" fill="var(--muted)">${(maxH * f).toFixed(2)}</text>`).join('');
    return `<p class="small muted">UPGMA法（${S.settings.table.method === 'jaccard' ? 'Jaccard距離' : 'Bray-Curtis距離、被度中央値の平方根'}）。右に行くほど非類似。色は区分された群です。</p>
      <div class="tablewrap" style="padding:8px"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:340px" role="img" aria-label="調査区の樹形図">${lines.join('')}${labels}${ticks}</svg></div>`;
  }
  function tableRows(res, tab) {
    const merge = S.settings.table.merge;
    const nameOf = k => { const { sp, layer } = VEG.Analysis.labelOf(k); return [sp, merge ? '' : layerName(layer)]; };
    if (tab === 'synoptic') {
      const syn = VEG.Analysis.synoptic(res);
      return [['区分', '種名', '階層'].concat(res.diff.sizes.map((n, g) => '群' + VEG.Analysis.groupLabel(g) + '(n=' + n + ')'))]
        .concat(syn.map(row => [row.block.title].concat(nameOf(row.key), row.cells.map(c => c.cls + (c.range ? ' ' + c.range : '')))));
    }
    const order = tab === 'raw' ? res.releves.map((_, i) => i) : res.order;
    const head = [['区分', '種名', '階層'].concat(order.map(i => res.releves[i].code))];
    if (tab !== 'raw') head.push(['群', '', ''].concat(order.map(i => VEG.Analysis.groupLabel(res.groups[i]))));
    head.push(['面積(m2)', '', ''].concat(order.map(i => res.releves[i].area)));
    const blocks = tab === 'raw' ? [{ title: '', keys: res.mat.keys }] : res.blocks;
    blocks.forEach(b => b.keys.forEach(k => head.push([b.title].concat(nameOf(k), order.map(i => cellText(res.mat.rows.get(k)[i]))))));
    return head;
  }

  /* =========================================================
     判定・遷移
     ========================================================= */
  const anaState = { scenario: 'none', years: 30 };
  function renderAnalysis(id) {
    const rs = P().releves;
    if (!rs.length) { view.innerHTML = `<h1>判定・遷移</h1><div class="empty panel"><p>調査区を記録すると、群集の判定と遷移の予測ができます。</p><a class="btn primary" href="#list">調査区へ</a></div>${regionBrowserHTML()}`; bindRegionBrowser(); return; }
    const r = findR(id) || rs[0];
    view.innerHTML = `
      <h1>判定・遷移</h1>
      <p class="lead">都道府県・標高から植生帯と地方を決め、その範囲の群集を参照DBと照合します。遷移は植生帯ごとの標準的な年数をもとに、立地と下層の後継樹から速さを補正します。各結果の「算出の内訳」と<a href="#about">根拠と出典</a>で計算の中身を確認できます。</p>
      <label class="f" style="max-width:420px;margin-bottom:12px"><span>調査区</span><select id="aSel">${rs.map(x => `<option value="${esc(x.id)}"${x === r ? ' selected' : ''}>${esc(x.code)}　${esc(x.site || '')}</option>`).join('')}</select></label>
      <div class="twocol"><div>
        <section class="panel" id="ctxPanel"></section>
        <section class="panel"><h2>群集の判定</h2><div id="idBox"></div></section>
      </div><div>
        <section class="panel"><h2>遷移の予測</h2>
          <div class="grid2">
            <label class="f"><span>管理シナリオ</span><select id="scen">${Object.entries(VEG.Succession.SCENARIOS).map(([k, v]) => `<option value="${k}"${k === anaState.scenario ? ' selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>
            <label class="f"><span>経過年数：<b id="yv">${anaState.years}</b>年後</span><input type="range" id="yrs" min="0" max="200" step="5" value="${anaState.years}"></label>
          </div>
          <div id="sucBox"></div>
        </section>
      </div></div>
      ${regionBrowserHTML(r)}`;
    $('#aSel').onchange = e => { location.hash = '#analysis/' + encodeURIComponent(e.target.value); };
    $('#scen').onchange = e => { anaState.scenario = e.target.value; drawSuc(); };
    $('#yrs').oninput = e => { anaState.years = +e.target.value; $('#yv').textContent = anaState.years; drawSuc(true); };
    let idRes = null, pred = null;
    function drawCtx() {
      const ctx = VEG.Analysis.contextOf(r, cfg());
      $('#ctxPanel').innerHTML = `<h2>立地と植生帯</h2>
        <dl class="kv"><dt>地点</dt><dd>${esc(r.pref || '未設定')}　${esc(r.site || '')}</dd><dt>標高・傾斜</dt><dd>${esc(r.elev || '-')} m、${esc(r.slope || '-')}°、${esc(r.aspect || '-')}</dd>
        <dt>微地形・土壌</dt><dd>${esc(r.topo || '-')}、${esc(r.soil || '-')}、${esc(r.moist || '-')}</dd><dt>人為的影響</dt><dd>${esc(r.impact || '-')}${r.yearsSince ? '（' + esc(r.yearsSince) + '年経過）' : ''}</dd></dl>
        <div class="grid2" style="margin-top:10px">
          <label class="f"><span>植生帯（推定：${ctx.zone ? esc(VEG.ZONES[ctx.zone].short) : '不明'}）</span><select id="zOv"><option value="">推定値を使う</option>${Object.entries(VEG.ZONES).map(([k, v]) => `<option value="${k}"${r.zoneOverride === k ? ' selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>
          <label class="f"><span>気候区分</span><select id="sOv"><option value="">推定値（${ctx.pref ? (ctx.pref.sea === 'J' ? '日本海側' : '太平洋側') : '-'}）</option><option value="J"${r.seaOverride === 'J' ? ' selected' : ''}>日本海側（多雪）</option><option value="P"${r.seaOverride === 'P' ? ' selected' : ''}>太平洋側（少雪）</option></select></label>
        </div>
        ${!r.pref ? '<p class="note">都道府県が未設定のため、地域による絞り込みが効いていません。</p>' : ''}`;
      $('#zOv').onchange = e => { r.zoneOverride = e.target.value; save(); drawAll(); };
      $('#sOv').onchange = e => { r.seaOverride = e.target.value; save(); drawAll(); };
    }
    function drawId() {
      idRes = VEG.Analysis.identify(r, syntaxa(), cfg());
      if (!idRes.results.length) { $('#idBox').innerHTML = '<p class="muted">参照DBの群集と共通する種がありません。種名の表記（カタカナ和名）を確認してください。</p>'; return; }
      $('#idBox').innerHTML = idRes.results.map((x, i) => `<div class="cand${i === 0 ? ' top' : ''}">
        <div class="spread"><span><b>${esc(x.s.ja)}</b> <span class="badge">${esc(VEG.STAGES[x.s.stage].short)}</span>${x.flags.map(f => `<span class="flag">${esc(f)}</span>`).join('')}</span><b>${Math.round(x.score * 100)}%</b></div>
        <div class="small muted"><i>${esc(x.s.la)}</i>　${esc(x.s.cls)}</div>
        <div class="bar"><i style="width:${Math.round(x.score * 100)}%"></i></div>
        <div class="chips">${x.s.char.map(n => `<span class="chip ${x.hitChar.includes(n) ? 'hit' : 'miss'}" title="標徴種・優占種">${esc(n)}</span>`).join('')}${x.hitDiff.map(n => `<span class="chip char" title="識別種">${esc(n)}</span>`).join('')}</div>
        <p class="small" style="margin-top:6px">${esc(x.s.note)}</p>
        ${breakdownHTML(x)}</div>`).join('') +
        `<p class="small muted">適合度は本アプリ独自の目安で、確率ではありません。塗りつぶしは確認済み、取り消し線は未確認の標徴種です。<a href="#about">算出方法と根拠</a></p>`;
    }
    function drawSuc(onlyYear) {
      if (!onlyYear || !pred) pred = VEG.Succession.predict(r, idRes, syntaxa(), cfg(), anaState.scenario);
      const at = pred.at(anaState.years);
      const rng = (at.early.name !== at.late.name) ? `<p class="small">幅：早ければ「${esc(at.early.name)}」、遅ければ「${esc(at.late.name)}」</p>` : '';
      $('#sucBox').innerHTML = `
        <p style="margin-top:10px">現在：<b>${esc(VEG.STAGES[pred.stage].name)}</b>${pred.current ? '（' + esc(pred.current.ja) + '）' : ''}<br><span class="small muted">${esc(VEG.ZONES[pred.ctx.zone].name)}${pred.series !== 'zonal' ? '、' + (pred.series === 'wetland' ? '湿地系列' : '海岸系列') : ''}</span></p>
        <p class="yearout">${anaState.years}年後：${esc(at.typical.name)}</p>${rng}
        <div class="timeline">${timelineSVG(pred, anaState.years)}</div>
        ${pred.notes.map(n => `<p class="note">${esc(n)}</p>`).join('')}
        ${pred.climaxRank.length ? `<h3>到達しうる極相（潜在自然植生）の候補</h3>${pred.climaxRank.map((c, i) => `<div class="cand"><b>${i + 1}. ${esc(c.s.ja)}</b><div class="small muted">${esc(c.why.join('／') || '植生帯・地方から')}</div></div>`).join('')}` : ''}
        <details class="why"><summary>算出の内訳</summary>
          <p class="small">現在の段階：${pred.current ? `参照DBでの判定（${esc(pred.current.ja)}、段階${pred.current.stage}）` : '判定の適合度が30%未満のため階層構造から推定'}。階層構造からの推定は「${esc(VEG.STAGES[pred.structuralStage].name)}」です（高木・亜高木層の植被率30%以上で林分、低木層30%以上で低木林、など）。</p>
          <table class="plain"><thead><tr><th>補正</th><th>係数</th></tr></thead><tbody>
            ${pred.mods.length ? pred.mods.map(m => `<tr><td>${esc(m.label)}</td><td>×${(+m.mult.toFixed(2))}</td></tr>`).join('') : '<tr><td>補正なし</td><td>×1</td></tr>'}
            <tr><th>合計（各段階の年数に掛ける）</th><th>×${(+pred.factor.toFixed(2))}</th></tr></tbody></table>
          <p class="small" style="margin-top:8px">使用した年数（${esc(VEG.ZONES[pred.ctx.zone].short)}、補正前、早い／標準／遅い）</p>
          <table class="plain"><tbody>${VEG.STAGES.slice(0, 7).map((st, i) => `<tr><td>${esc(st.name)}</td><td>${pred.yearsTable[i].join('／')} 年</td></tr>`).join('')}</tbody></table>
          ${r.yearsSince ? `<p class="small" style="margin-top:6px">攪乱後の年数（${esc(r.yearsSince)}年）は、現在の段階に入ってからの年数が不明なため半分を経過済みとして差し引いています。</p>` : ''}
        </details>
        <p class="small muted">段階の区分は二次遷移の一般的な記述にもとづきますが、年数と補正係数は本アプリの目安です。<a href="#about">根拠と出典</a></p>`;
    }
    function drawAll() { drawCtx(); drawId(); drawSuc(); }
    drawAll();
    bindRegionBrowser();
  }

  function breakdownHTML(x) {
    const pct = v => (v * 100).toFixed(1) + '%';
    const rows = x.parts.map(p => `<tr class="${p.present ? '' : 'absent'}"><td>${esc(p.sp)}</td><td>${esc(p.role.replace('標徴種・優占種', '標徴・優占'))}</td><td>${p.w}</td><td>${p.present ? esc(p.cover) : '—'}</td><td>${p.present ? p.factor.toFixed(2) : '0'}</td><td>${p.contrib.toFixed(2)}</td></tr>`).join('');
    return `<details class="why"><summary>算出の内訳</summary>
      <table class="plain"><thead><tr><th>種</th><th>役割</th><th>重み</th><th>被度</th><th>被度係数</th><th>寄与</th></tr></thead><tbody>${rows}
      <tr><th colspan="5">合計 ÷ 最大値</th><th>${x.got.toFixed(2)} ÷ ${x.max.toFixed(2)} ＝ ${pct(x.raw)}</th></tr></tbody></table>
      <p class="small" style="margin-top:6px">${x.domHit ? `最上層の優占種（${esc(x.dominant)}）が一致：＋${x.weights.domBonus} → ` : ''}組成一致度 ${pct(x.floristic)}</p>
      <table class="plain"><tbody>${x.geoParts.map(g => `<tr><td>${esc(g.label)}</td><td>×${g.mult}</td></tr>`).join('')}
      <tr><th>地理的整合係数</th><th>×${(+x.geo.toFixed(3))}</th></tr></tbody></table>
      <p class="small" style="margin-top:6px"><b>適合度 ＝ ${pct(x.floristic)} × ${(+x.geo.toFixed(3))} ＝ ${pct(x.score)}</b></p></details>`;
  }
  function timelineSVG(pred, year) {
    const path = pred.path;
    const lastStart = path.length ? path[path.length - 1].start[2] : 0;
    const maxY = Math.min(400, Math.max(60, Math.ceil((lastStart * 1.15 + 10) / 10) * 10, year + 10));
    const L = 168, W = 520, R = 14, rowH = 36, top = 10, H = top + path.length * rowH + 34;
    const x = y => L + (W - L - R) * Math.min(1, y / maxY);
    const rows = path.map((p, i) => {
      const y0 = top + i * rowH;
      const next = path[i + 1];
      const e = next ? next.start[1] : maxY;
      const cur = year >= p.start[1] && year < e;
      const name = p.name.length > 11 ? p.name.slice(0, 10) + '…' : p.name;
      return `<g><text x="${L - 8}" y="${y0 + 21}" text-anchor="end" font-size="14" font-weight="${cur ? 800 : 500}"><title>${esc(p.name)}</title>${esc(name)}</text>
        <line x1="${x(p.start[0])}" x2="${x(p.start[2])}" y1="${y0 + 17}" y2="${y0 + 17}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 3"/>
        <rect x="${x(p.start[1])}" y="${y0 + 8}" width="${Math.max(3, x(e) - x(p.start[1]))}" height="18" rx="3" fill="${cur ? 'var(--tape)' : 'var(--forest)'}" opacity="${cur ? 1 : 0.75}"/></g>`;
    }).join('');
    const ticks = []; const step = maxY > 200 ? 50 : maxY > 100 ? 25 : 10;
    for (let t = 0; t <= maxY; t += step) ticks.push(`<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 26}" stroke="var(--line)"/><text x="${x(t)}" y="${H - 10}" font-size="13" text-anchor="middle" fill="var(--muted)" style="fill:var(--muted)">${t}</text>`);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="遷移の時間軸">${ticks.join('')}${rows}
      <line x1="${x(year)}" x2="${x(year)}" y1="${top - 4}" y2="${H - 24}" stroke="var(--tape)" stroke-width="2.5"/>
      <text x="${W - R}" y="${H - 10}" font-size="11" text-anchor="end" fill="var(--muted)" style="fill:var(--muted)">年</text></svg>
      <p class="small muted">帯は標準的な到達時期、点線は早い〜遅い場合の開始時期の幅。</p>`;
  }

  function regionBrowserHTML(r) {
    return `<details class="panel"><summary>地域ごとの群集一覧（調査前の下調べ）</summary>
      <div class="grid2" style="margin-top:10px">
        <label class="f"><span>都道府県</span><select id="rbPref">${opts(VEG.PREFS.map(p => p.name), (r && r.pref) || '東京都')}</select></label>
        <label class="f"><span>標高 (m)</span><input type="number" id="rbElev" value="${esc((r && r.elev) || 100)}"></label>
      </div><div id="rbOut"></div></details>`;
  }
  function bindRegionBrowser() {
    const draw = () => {
      const pref = $('#rbPref').value, elev = $('#rbElev').value;
      const z = VEG.zoneOf(pref, elev, cfg().prefOverrides);
      const list = VEG.Analysis.candidatesFor(pref, elev, syntaxa(), cfg());
      $('#rbOut').innerHTML = `<p class="small" style="margin-top:8px">${esc(VEG.ZONES[z].name)}</p>` + list.map(({ s, seaMatch }) => `<div class="cand"><b>${esc(s.ja)}</b> <span class="badge">${esc(VEG.STAGES[s.stage].short)}</span>${seaMatch ? '' : '<span class="flag">' + (s.sea === 'J' ? '日本海側型' : '太平洋側型') + '</span>'}
        <div class="small muted"><i>${esc(s.la)}</i></div><div class="small">標徴種・優占種：${esc(s.char.join('、'))}／識別種：${esc(s.diff.join('、') || '-')}</div></div>`).join('');
    };
    if (!$('#rbPref')) return;
    $('#rbPref').onchange = draw; $('#rbElev').oninput = draw; draw();
  }

  /* =========================================================
     植生図
     ========================================================= */
  let mapObj = null;
  const mapState = { color: 'community', drawing: false, pts: [], temp: null };
  const PALETTE = ['#2E6F9E', '#C0582B', '#4E8A3A', '#8A4FA0', '#B08A1E', '#2C8C8C', '#A33A4E', '#5A5F6B', '#6B8E23', '#D2691E', '#1E6B52', '#7A4E2D'];
  // 群落名 → 色：現在の調査区と区画に出てくる群落名を五十音順に並べ、順に色を割り当てる（同じデータなら毎回同じ色）
  let colorReg = null;
  function buildColorReg() {
    const names = new Set(P().features.map(f => f.properties.community));
    P().releves.forEach(r => { const c = topCommunity(r); if (c) names.add(c.name); });
    colorReg = new Map(Array.from(names).sort((a, b) => a.localeCompare(b, 'ja')).map((n, i) => [n, PALETTE[i % PALETTE.length]]));
  }
  function colorForName(name) {
    if (!colorReg) buildColorReg();
    if (!colorReg.has(name)) colorReg.set(name, PALETTE[colorReg.size % PALETTE.length]);
    return colorReg.get(name);
  }

  function pointLabel(r) {
    if (mapState.color === 'group' && lastTable) {
      const i = lastTable.releves.indexOf(r);
      if (i >= 0) { const g = lastTable.groups[i]; return { label: '群' + VEG.Analysis.groupLabel(g), color: getComputedStyle(document.documentElement).getPropertyValue(GROUP_COLORS[g % 8]).trim() || PALETTE[g] }; }
      return { label: '解析対象外', color: '#888' };
    }
    const c = topCommunity(r); const n = c ? c.name : '判定なし';
    return { label: n, color: c ? colorForName(n) : '#888' };
  }

  function renderMap() {
    if (mapObj) { mapObj.off(); mapObj.remove(); mapObj = null; }
    mapState.temp = null; colorReg = null;
    const pts = P().releves.filter(r => r.lat !== '' && r.lng !== '' && !isNaN(+r.lat) && !isNaN(+r.lng));
    if (mapState.color === 'group' && !lastTable && included().length >= 2) computeTable();
    view.innerHTML = `
      <h1>植生図</h1>
      <p class="lead">調査区を判定結果で色分けし、同じ群落と判断できる範囲を区画として描いて現存植生図を作ります。背景地図は国土地理院タイル（表示した範囲は端末に保存され、圏外でも再表示できます）。</p>
      <section class="panel noprint">
        <div class="row">
          <label class="f" style="min-width:220px"><span>調査区の色分け</span><select id="mColor"><option value="community"${mapState.color === 'community' ? ' selected' : ''}>判定された群集</option><option value="group"${mapState.color === 'group' ? ' selected' : ''}>植生表の群</option></select></label>
          <button class="btn sm primary" id="mDraw">${mapState.drawing ? '描画を終える' : '植生区画を描く'}</button>
          <button class="btn sm" id="mGeo">GeoJSONを書き出す</button>
          <label class="btn sm"><input type="file" id="mImp" accept=".geojson,.json" hidden>GeoJSONを読み込む</label>
        </div>
        <div id="drawBox"></div>
      </section>
      <div id="map" role="region" aria-label="地図"></div>
      <div class="legend" id="legend"></div>
      <section class="panel" style="margin-top:14px"><h2>植生区画 <span class="small muted">${P().features.length}区画</span></h2><div id="fList"></div></section>`;
    $('#mColor').onchange = e => { mapState.color = e.target.value; renderMap(); };
    $('#mGeo').onclick = exportGeoJSON;
    $('#mImp').onchange = importGeoJSON;
    $('#mDraw').onclick = () => { mapState.drawing = !mapState.drawing; mapState.pts = []; renderMap(); };
    drawFeatureList();

    if (!window.L) {
      $('#mDraw').disabled = true; $('#mDraw').title = '地図ライブラリの取得後に使えます';
      if (document.readyState !== 'complete') { window.addEventListener('load', () => { if ((location.hash || '').startsWith('#map')) renderMap(); }, { once: true }); }
      fallbackMap(pts);
      return;
    }
    const L = window.L;
    mapObj = L.map('map', { zoomControl: true, doubleClickZoom: !mapState.drawing });
    const gsi = (id, ext, name) => L.tileLayer(`https://cyberjapandata.gsi.go.jp/xyz/${id}/{z}/{x}/{y}.${ext}`, { attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>', maxZoom: 18, crossOrigin: true });
    const base = { '標準地図': gsi('std', 'png'), '淡色地図': gsi('pale', 'png'), '写真': gsi('seamlessphoto', 'jpg'),
      'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }) };
    base['淡色地図'].addTo(mapObj);
    L.control.layers(base, null, { collapsed: true }).addTo(mapObj);
    L.control.scale({ imperial: false }).addTo(mapObj);

    // 先に表示範囲を決めてから図形を追加する（Leafletの初期化順序の制約）
    const ll = pts.map(r => [+r.lat, +r.lng]);
    P().features.forEach(f => ((f.geometry && f.geometry.coordinates && f.geometry.coordinates[0]) || []).forEach(c => ll.push([c[1], c[0]])));
    if (ll.length) mapObj.fitBounds(L.latLngBounds(ll).pad(0.3), { maxZoom: 16, animate: false });
    else mapObj.setView([36.2, 138.3], 5);
    const legend = new Map();
    P().features.forEach((f, i) => {
      const col = colorForName(f.properties.community);
      legend.set(f.properties.community, col);
      L.geoJSON(f, { interactive: !mapState.drawing, style: { color: col, weight: 2, fillColor: col, fillOpacity: 0.35 } })
        .bindPopup(`<b>${esc(f.properties.community)}</b><br>${esc(f.properties.note || '')}`).addTo(mapObj);
    });
    const markers = [];
    pts.forEach(r => {
      const p = pointLabel(r); legend.set(p.label, p.color);
      const m = L.circleMarker([+r.lat, +r.lng], { radius: 9, color: '#fff', weight: 2, fillColor: p.color, fillOpacity: 1, interactive: !mapState.drawing })
        .bindPopup(`<b>${esc(r.code)}</b> ${esc(r.site || '')}<br>${esc(p.label)}<br><a href="#edit/${encodeURIComponent(r.id)}">記録を開く</a>`)
        .bindTooltip(esc(r.code), { permanent: true, direction: 'right', offset: [8, 0], className: '' });
      m.addTo(mapObj); markers.push(m);
    });
    $('#legend').innerHTML = Array.from(legend.entries()).map(([k, c]) => `<span><i style="background:${c}"></i>${esc(k)}</span>`).join('');

    if (mapState.drawing) setupDrawing(L);
  }

  function setupDrawing(L) {
    const box = $('#drawBox');
    const comms = Array.from(new Set(P().releves.map(r => (topCommunity(r) || {}).name).filter(Boolean).concat(syntaxa().map(s => s.ja))));
    box.innerHTML = `<p class="small" style="margin-top:10px">地図をタップして頂点を置き、3点以上で「区画を保存」。</p>
      <div class="grid2"><label class="f"><span>群落名</span><input type="text" id="dName" list="commList" placeholder="例：ヤブコウジ－スダジイ群集"></label>
      <label class="f"><span>メモ</span><input type="text" id="dNote" placeholder="判読根拠など"></label></div>
      <datalist id="commList">${comms.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <div class="row" style="margin-top:8px"><button class="btn sm tape" id="dSave">区画を保存</button><button class="btn sm" id="dUndo">1点戻す</button><span class="small muted" id="dCount">0点</span></div>`;
    const redraw = () => {
      if (mapState.temp) mapState.temp.remove();
      mapState.temp = L.polygon(mapState.pts, { color: '#D92E63', weight: 2, dashArray: '5 4', fillOpacity: 0.15, interactive: false }).addTo(mapObj);
      $('#dCount').textContent = mapState.pts.length + '点';
    };
    mapObj.on('click', e => { mapState.pts.push([e.latlng.lat, e.latlng.lng]); redraw(); });
    $('#dUndo').onclick = () => { mapState.pts.pop(); redraw(); };
    $('#dSave').onclick = () => {
      const name = $('#dName').value.trim();
      if (mapState.pts.length < 3) { toast('3点以上を置いてください'); return; }

      const ring = mapState.pts.map(p => [+p[1].toFixed(6), +p[0].toFixed(6)]); ring.push(ring[0]);
      P().features.push({ type: 'Feature', properties: { community: name, note: $('#dNote').value.trim(), color: colorForName(name), created: today() }, geometry: { type: 'Polygon', coordinates: [ring] } });
      save(true); mapState.pts = []; toast('区画を保存しました'); renderMap();

  }
  function drawFeatureList() {
    $('#fList').innerHTML = P().features.length ? `<table class="plain"><thead><tr><th>群落</th><th>面積（概算）</th><th></th></tr></thead><tbody>${P().features.map((f, i) =>
      `<tr><td><i style="display:inline-block;width:12px;height:12px;border-radius:2px;background:${colorForName(f.properties.community)}"></i> ${esc(f.properties.community)}</td><td>${polyArea(f).toFixed(2)} ha</td><td><button class="btn sm danger" data-fdel="${i}">削除</button></td></tr>`).join('')}</tbody></table>`
      : '<p class="muted small">まだ区画はありません。「植生区画を描く」で、同じ群落が広がる範囲を地図上に描けます。</p>';
    $('#fList').onclick = e => { const b = e.target.closest('[data-fdel]'); if (!b) return; if (!confirm('この区画を削除しますか？')) return; P().features.splice(+b.dataset.fdel, 1); save(true); renderMap(); };
  }
  function polyArea(f) {
    const ring = f.geometry && f.geometry.coordinates && f.geometry.coordinates[0]; if (!ring) return 0;
    const R = 6378137, rad = Math.PI / 180; let s = 0;
    for (let i = 0; i < ring.length - 1; i++) { const [x1, y1] = ring[i], [x2, y2] = ring[i + 1]; s += (x2 - x1) * rad * (2 + Math.sin(y1 * rad) + Math.sin(y2 * rad)); }
    return Math.abs(s * R * R / 2) / 10000;
  }
  function fallbackMap(pts) {
    const el = $('#map');
    if (!pts.length) { el.innerHTML = '<div class="empty">地図ライブラリを読み込めていません（初回はオンラインで開く必要があります）。緯度・経度のある調査区もまだありません。</div>'; return; }
    const lats = pts.map(r => +r.lat), lngs = pts.map(r => +r.lng);
    const [a, b, c, d] = [Math.min(...lats), Math.max(...lats), Math.min(...lngs), Math.max(...lngs)];
    const pad = 0.1, W = 600, H = 420;
    const sx = v => 30 + (W - 60) * ((v - c) / ((d - c) || 1e-4));
    const sy = v => H - 30 - (H - 60) * ((v - a) / ((b - a) || 1e-4));
    const leg = new Map();
    const dots = pts.map(r => { const p = pointLabel(r); leg.set(p.label, p.color); return `<circle cx="${sx(+r.lng)}" cy="${sy(+r.lat)}" r="8" fill="${p.color}" stroke="#fff" stroke-width="2"/><text x="${sx(+r.lng) + 11}" y="${sy(+r.lat) + 4}" font-size="12" style="fill:var(--ink)">${esc(r.code)}</text>`; }).join('');
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%">${dots}</svg>`;
    $('#legend').innerHTML = '<span class="muted">背景地図なし（地図ライブラリ未取得）。位置関係のみ表示しています。</span>' + Array.from(leg.entries()).map(([k, c]) => `<span><i style="background:${c}"></i>${esc(k)}</span>`).join('');
    void pad;
  }
  function exportGeoJSON() {
    const feats = P().releves.filter(r => r.lat !== '' && r.lng !== '').map(r => {
      const c = topCommunity(r);
      const gi = lastTable ? lastTable.releves.indexOf(r) : -1;
      return { type: 'Feature', geometry: { type: 'Point', coordinates: [+r.lng, +r.lat] },
        properties: { kind: 'releve', code: r.code, site: r.site, date: r.date, pref: r.pref, elev: r.elev, area_m2: r.area, community: c ? c.name : '', score: c ? +c.score.toFixed(3) : null, group: gi >= 0 ? VEG.Analysis.groupLabel(lastTable.groups[gi]) : '', n_species: new Set((r.records || []).map(x => x.sp)).size } };
    });
    const polys = P().features.map(f => Object.assign({}, f, { properties: Object.assign({ kind: 'vegetation_unit' }, f.properties) }));
    download(`vegetation_map_${today()}.geojson`, JSON.stringify({ type: 'FeatureCollection', features: feats.concat(polys) }, null, 1), 'application/geo+json');
  }
  function importGeoJSON(e) {
    const file = e.target.files[0]; if (!file) return;
    file.text().then(t => {
      const j = JSON.parse(t); let n = 0;
      (j.features || []).forEach(f => { if (f.geometry && f.geometry.type === 'Polygon') { f.properties = f.properties || {}; f.properties.community = f.properties.community || f.properties.name || '名称なし'; P().features.push(f); n++; } });
      save(true); toast(`${n}区画を読み込みました`); renderMap();
    }).catch(() => toast('GeoJSONを読み込めませんでした。ファイル形式を確認してください。'));
  }

          <tr><td>気候区分</td><td><select data-zk="sea">${[['J', '日本海側'], ['P', '太平洋側']].map(([k, n]) => `<option value="${k}"${v('sea') === k ? ' selected' : ''}>${n}</option>`).join('')}</select></td></tr></tbody></table>
          <button class="btn sm" id="zReset" style="margin-top:8px">${esc(name)}を既定値に戻す</button>`;
        $('#zEdit').onchange = e => { const k = e.target.dataset.zk; if (!k) return; c.prefOverrides[name] = Object.assign({}, c.prefOverrides[name], { [k]: k === 'sea' ? e.target.value : +e.target.value }); save(); toast('境界を更新しました'); };
        $('#zReset').onclick = () => { delete c.prefOverrides[name]; save(); zEdit(); };
      };
      $('#zPref').onchange = zEdit; zEdit();
      if ($('#yReset')) $('#yReset').onclick = () => { if (confirm('遷移年数を内蔵の目安値に戻しますか？')) { c.stageYears = null; save(true); renderSettings(); } };
      $('#dbRep').onchange = e => { c.replaceDB = e.target.checked; save(); toast(c.replaceDB ? '追加分のDBだけを使います' : '内蔵DBと追加分を併用します'); };
      $('#dbClr').onclick = () => { if (confirm(`追加した群集データ（${c.customSyntaxa.length}群集）を消去しますか？`)) { c.customSyntaxa = []; c.replaceDB = false; save(true); refreshSpeciesList(); renderSettings(); } };
      if ($('#csvOut')) $('#csvOut').onclick = () => {
        const head = ['調査区', '調査日', '調査者', '都道府県', '地点名', '緯度', '経度', '標高', '傾斜', '方位', '微地形', '土壌', '湿り', '人為的影響', '経過年数', '面積m2', '階層', '種名', '被度', '群度'];
        const rows = [head];
        p.releves.forEach(r => (r.records || []).forEach(x => rows.push([r.code, r.date, r.observer, r.pref, r.site, r.lat, r.lng, r.elev, r.slope, r.aspect, r.topo, r.soil, r.moist, r.impact, r.yearsSince, r.area, layerName(x.layer), x.sp, x.cover, x.soc])));
        download(`${safeName(p.name)}_records_${today()}.csv`, toCSV(rows), 'text/csv');
      };
    }
    $('#bkOut').onclick = () => download(`vegsurvey_backup_${today()}.json`, JSON.stringify({ format: 'vegsurvey-backup-2', version: VERSION, exported: new Date().toISOString(), data: S }, null, 1), 'application/json');
    $('#bkIn').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      file.text().then(t => {
        const j = JSON.parse(t); const d = j.data || j;
        let projects = d.projects;
        if (!projects && Array.isArray(d.releves)) { const pp = makeProject('復元したデータ'); pp.releves = d.releves; pp.features = d.features || []; projects = [pp]; }
        if (!Array.isArray(projects)) throw new Error('プロジェクトのデータがありません');
        const ids = new Set(S.projects.map(x => x.id));
        projects.map(normalizeProject).forEach(pp => { if (ids.has(pp.id)) { pp.id = pp.id + '-' + Date.now().toString(36); pp.name += '（復元）'; } S.projects.push(pp); });
        save(true); refreshSpeciesList(); toast(`${projects.length}プロジェクトを復元しました`); location.hash = '#home';
      }).catch(err => alert('復元できませんでした：' + err.message));
    };
    $('#wipe').onclick = () => {
      if (!confirm(`すべてのプロジェクト（${S.projects.length}件）と設定をこの端末から消去します。元に戻せません。\nExcelへの書き出しは済んでいますか？`)) return;
      if (prompt('確認のため「消去」と入力してください') !== '消去') { toast('消去を取り消しました'); return; }
      S = defaults(); save(true); applyTheme(); toast('消去しました'); location.hash = '#home';
    };
  }

  /* ---------------- 起動 ---------------- */
  applyTheme(); updateNet(); refreshSpeciesList(); route();
  window.VEG_APP = { state: () => S, version: VERSION };
})();

</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
